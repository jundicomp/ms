            <button class="btn-secondary" onclick="openClientDetail('${c.id}')" title="Cetak profil sebagai PDF">${ICON_STAT_DOC} Cetak</button>
          </div>
        </div>
      </div>
    </div>`;

  const statsHtml = `<div class="grid grid-4">
    <div class="card"><div class="stat-label">Pekerjaan Aktif</div><div class="stat-value">${activeJobs}</div></div>
    <div class="card"><div class="stat-label">Pekerjaan Selesai</div><div class="stat-value">${doneJobs}</div></div>
    <div class="card"><div class="stat-label">Reminder Aktif</div><div class="stat-value">${clientReminders.length}</div></div>
    <div class="card"><div class="stat-label">Dokumen</div><div class="stat-value">${clientDocs.length}</div></div>
  </div>`;

  const tabsHtml = `<div class="tabs-row">
    <button class="tab-btn ${state.clientMonitoring.tab==='detail'?'active':''}" onclick="setMonitoringTab('detail')">Detail Klien</button>
    <button class="tab-btn ${state.clientMonitoring.tab==='ringkasan'?'active':''}" onclick="setMonitoringTab('ringkasan')">Ringkasan</button>
    <button class="tab-btn ${state.clientMonitoring.tab==='pekerjaan'?'active':''}" onclick="setMonitoringTab('pekerjaan')">Pekerjaan</button>
    <button class="tab-btn ${state.clientMonitoring.tab==='reminder'?'active':''}" onclick="setMonitoringTab('reminder')">Reminder</button>
    <button class="tab-btn ${state.clientMonitoring.tab==='invoice'?'active':''}" onclick="setMonitoringTab('invoice')">Invoice</button>
    <button class="tab-btn ${state.clientMonitoring.tab==='dokumen'?'active':''}" onclick="setMonitoringTab('dokumen')">Dokumen</button>
  </div>`;

  let tabContent = '';
  if (state.clientMonitoring.tab === 'detail'){
    tabContent = renderClientDetailTab(c);

  } else if (state.clientMonitoring.tab === 'ringkasan'){
    const timeline = [
      ...clientJobs.map(j=>({ tgl: j.tanggalMulai, label: `Pekerjaan "${j.judul}" — status ${j.status}` })),
      ...clientReminders.map(r=>({ tgl: r.tanggalValue && r.tanggalValue.length===10 ? r.tanggalValue : null, label: `Reminder: ${r.isiReminder.map(n=>REMINDER_ITEMS[n-1]).join(', ')}` })),
    ].filter(t=>t.tgl).sort((a,b)=> b.tgl.localeCompare(a.tgl));

    tabContent = timeline.length ? `<div class="card"><table class="jobs-table">
      <tr class="table-navy-head"><th>No</th><th>Tanggal</th><th>Aktivitas</th></tr>
      ${timeline.map((t,idx)=>`<tr><td>${idx+1}</td><td class="nowrap-cell">${formatDDMMYY(t.tgl)}</td><td>${t.label}</td></tr>`).join('')}
    </table></div>` : `<div class="empty">Belum ada aktivitas tercatat untuk klien ini.</div>`;

  } else if (state.clientMonitoring.tab === 'pekerjaan'){
    tabContent = clientJobs.length ? clientJobs.map(j=>{
      const assignee = MOCK_USERS.find(u=>u.email===j.ditugaskanKe);
      const totalHari = calcTotalHari(j.tanggalMulai, j.tenggatWaktu);
      const needsMyAction = jobNeedsAction(j, myEmail);
      let actionBlock = '';
      if (needsMyAction){
        actionBlock = j.approverEmail===myEmail && j.status==='Menunggu Persetujuan'
          ? buildApproverActionHtml(j)
          : `<div style="margin-top:10px;">${buildAssigneeActionHtml(j)}</div>`;
      }
      return `<div class="card" style="margin-bottom:14px;${needsMyAction?'border-color:var(--gold);':''}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
          <div>
            <div style="font-weight:600;color:var(--navy);font-size:14.5px;">${j.judul}</div>
            <div style="font-size:12.5px;color:var(--ink-soft);margin-top:4px;">${j.deskripsi||''}</div>
            <div style="font-size:11.5px;color:var(--ink-soft);margin-top:6px;">
              Ditugaskan ke: <b>${assignee?assignee.nama:'-'}</b> &nbsp;·&nbsp;
              Target Selesai: <b>${formatDDMMYY(j.tenggatWaktu)}</b>${totalHari!==null?` (${totalHari} hari)`:''}
            </div>
          </div>
          <span class="badge ${JOB_STATUS_BADGE[j.status]||'pending'}${needsMyAction?' badge-blink':''}">${j.status}</span>
        </div>
        ${actionBlock}
      </div>`;
    }).join('') : `<div class="empty">Belum ada pekerjaan terkait klien ini.</div>`;

  } else if (state.clientMonitoring.tab === 'reminder'){
    if (!clientReminders.length){
      tabContent = `<div class="empty">Belum ada reminder untuk klien ini.</div>`;
    } else {
      const reminderTabColumns = [
        { key:'jenisJadwal', label:'Jenis Jadwal', searchable:true, sortValue:(r)=>r.jenisJadwal.toLowerCase(), searchValue:(r)=>r.jenisJadwal, cell:(r)=>r.jenisJadwal },
        { key:'tanggal', label:'Tanggal', searchable:false, sortValue:(r)=>r.tanggalValue||'', nowrap:true, cell:(r)=> r.tanggalMode === 'Bulan Ini Saja' ? formatDDMMYY(r.tanggalValue) : `Tanggal ${r.tanggalValue} setiap bulan` },
        { key:'lama', label:'Lama Reminder', searchable:false, sortValue:(r)=>Number(r.lamaReminderHari)||0, cell:(r)=>`${r.lamaReminderHari} hari` },
        { key:'isi', label:'Isi Reminder', searchable:true, searchValue:(r)=>r.isiReminder.map(n=>REMINDER_ITEMS[n-1]).join(' '), cell:(r)=>`<span style="font-size:12px;">${r.isiReminder.map(n=>`${n}. ${REMINDER_ITEMS[n-1]}`).join('<br>')}</span>` },
      ];
      tabContent = managedTableBlock('reminder_tab_'+c.id, reminderTabColumns, () => MOCK_REMINDERS.filter(r=>r.clientId===c.id), 'Cari jenis jadwal atau isi reminder...');
    }

  } else if (state.clientMonitoring.tab === 'invoice'){
    tabContent = renderInvoiceTab(c);

  } else if (state.clientMonitoring.tab === 'dokumen'){
    tabContent = renderDokumenTab(c);
  }

  const fullBody = selectorHtml + headerHtml + statsHtml + tabsHtml + tabContent;
  return embedded ? fullBody : head('Monitoring Klien', 'Pantau profil, pekerjaan, reminder, invoice, dan dokumen untuk satu klien sekaligus') + fullBody;
}

let sedangMenyimpanPengaturan = false;
async function handleSystemSettingsSubmit(ev){
  ev.preventDefault();
  if (sedangMenyimpanPengaturan) return;
  const s = state.systemSettings;
  s.namaKantor = getFieldVal('ss-namaKantor');
  s.alamatKantor = getFieldVal('ss-alamatKantor');
  s.emailKantor = getFieldVal('ss-emailKantor');
  s.teleponKantor = getFieldVal('ss-teleponKantor');
  s.noWhatsapp = getFieldVal('ss-noWhatsapp');
  s.kodeInvoice = getFieldVal('ss-kodeInvoice');
  s.websiteKantor = getFieldVal('ss-websiteKantor');
  s.namaBank = getFieldVal('ss-namaBank');
  s.noRekening = getFieldVal('ss-noRekening');
  s.namaPemilikRekening = getFieldVal('ss-namaPemilikRekening');
  s.namaPimpinan = getFieldVal('ss-namaPimpinan');
  s.jabatanPimpinan = getFieldVal('ss-jabatanPimpinan');
  s.driveAccountEmail = getFieldVal('ss-driveAccountEmail');
  s.namaPengirimEmail = getFieldVal('ss-namaPengirimEmail');
  s.alamatPengirimEmail = getFieldVal('ss-alamatPengirimEmail');
  s.templateReminder = getFieldVal('ss-templateReminder');
  s.zonaWaktu = getFieldVal('ss-zonaWaktu');
  s.formatTanggal = getFieldVal('ss-formatTanggal');
  s.waktuTimeoutMenit = Number(getFieldVal('ss-waktuTimeoutMenit')) || 15;

  sedangMenyimpanPengaturan = true;
  try {
    const { saved, ...updates } = s; // "saved" cuma penanda tampilan lokal, tidak perlu ikut disimpan
    const resp = await callBackendUtama('updateSystemSettings', { updates });
    if (!resp.success) throw new Error(resp.message || 'Gagal menyimpan.');
    s.saved = true;
    logActivity('Ubah Pengaturan Sistem', 'Profil perusahaan / rekening / tanda tangan diperbarui');
    mulaiPengawasanIdle(); // terapkan durasi timeout baru langsung, tidak perlu tunggu timer lama habis
  } catch (err) {
    alert('Gagal menyimpan pengaturan: ' + err.message);
  } finally {
    sedangMenyimpanPengaturan = false;
    render();
  }
}
function handleLogoKantorChange(input){
  const file = input.files && input.files[0];
  if (!file) return;
  const preview = document.getElementById('ss-logo-preview');
  const reader = new FileReader();
  reader.onload = async (e) => {
    if (preview) preview.innerHTML = '<span style="font-size:11px;color:var(--ink-soft);">Mengunggah...</span>';
    try {
      const hasil = await callBackendUtama('uploadLogoKantor', { base64Data: e.target.result, mimeType: file.type });
      if (!hasil.success) throw new Error(hasil.message || 'Gagal mengunggah logo.');
      state.systemSettings.logoKantor = hasil.url;
      if (preview) preview.innerHTML = `<img src="${hasil.url}" style="max-width:100%;max-height:100%;object-fit:contain;">`;
    } catch (err) {
      if (preview) preview.innerHTML = 'Logo';
      alert('Gagal mengunggah logo: ' + err.message);
    }
  };
  reader.readAsDataURL(file);
}

function exportRowsToWord(filename, title, rows){
  if (!rows.length) { alert('Tidak ada data untuk diekspor'); return; }
  const headers = Object.keys(rows[0]);
  const headHtml = headers.map(h=>`<th>${h}</th>`).join('');
  const bodyHtml = rows.map(r=>`<tr>${headers.map(h=>`<td>${r[h]}</td>`).join('')}</tr>`).join('');
  const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
    <head><meta charset='utf-8'><title>${title}</title></head>
    <body style="font-family:Calibri,Arial,sans-serif;">
      <h2 style="color:#16233F;">${title}</h2>
      <table border="1" cellspacing="0" cellpadding="6" style="border-collapse:collapse;font-size:11pt;width:100%;">
        <tr style="background:#16233F;color:#ffffff;">${headHtml}</tr>
        ${bodyHtml}
      </table>
    </body></html>`;
  const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  document.body.appendChild(link); link.click(); link.remove();
}

// rows: array object; columns: [{key,label}]; photoKey: nama field foto (data URL) opsional
function exportRowsToPDF(filename, title, rows, columns, photoKey){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(14);
  doc.text(title, 14, 16);

  const head = photoKey ? [['Foto', ...columns.map(c=>c.label)]] : [columns.map(c=>c.label)];
  const body = rows.map(r => {
    const line = columns.map(c => r[c.key] ?? '');
    return photoKey ? ['', ...line] : line;
  });

  doc.autoTable({
    startY: 22,
    head,
    body,
    headStyles: { fillColor: [22,35,63] },
    styles: { fontSize: 9.5, minCellHeight: photoKey ? 14 : undefined, valign: 'middle' },
    columnStyles: photoKey ? { 0: { cellWidth: 16 } } : {},
    didDrawCell: (data) => {
      if (!photoKey) return;
      if (data.section === 'body' && data.column.index === 0){
        const photo = rows[data.row.index][photoKey];
        if (photo){
          const format = photo.includes('image/png') ? 'PNG' : 'JPEG';
          const size = 10;
          const x = data.cell.x + (data.cell.width - size)/2;
          const y = data.cell.y + (data.cell.height - size)/2;
          try { doc.addImage(photo, format, x, y, size, size); } catch(e){}
        }
      }
    },
  });
  doc.save(filename);
}

function getRevenueTrend(nMonths){
  const result = [];
  for (let i = nMonths - 1; i >= 0; i--){

    const total = MOCK_INVOICES.filter(inv=>{

function rupiahSingkat(n){
  if (n >= 1000000000) return (n/1000000000).toFixed(1).replace('.',',') + 'M';
  if (n >= 1000000) return (n/1000000).toFixed(1).replace('.',',') + 'jt';
  if (n >= 1000) return Math.round(n/1000) + 'rb';
  return String(n);
}
function renderBarChartSvg(data){
  const w = 480, h = 170, padBottom = 24, padTop = 26, padSide = 14;
  const max = Math.max(1, ...data.map(d=>d.total));
  const plotW = w - padSide * 2;
  const gap = plotW / data.length;
  const barW = gap * 0.42;

  const points = data.map((d,i)=>{
    const x = padSide + i * gap + gap / 2;
    const barH = max ? (d.total / max) * (h - padBottom - padTop) : 0;
    const y = h - padBottom - barH;
    return { x, y, d, barH };
  });

  const bars = points.map(p=>{
    const x = p.x - barW / 2;
    const y = h - padBottom - Math.max(p.barH, 1);
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(p.barH,1).toFixed(1)}" fill="var(--gold-soft)" rx="2"></rect>
      <text x="${p.x.toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="9" fill="#5B5E68" font-family="Inter,sans-serif">${p.d.label}</text>`;
  }).join('');

  // Garis progres — hijau kalau naik dari bulan sebelumnya, merah kalau turun
  let lineSegments = '';
  for (let i=1;i<points.length;i++){
    const prev = points[i-1], cur = points[i];
    const naik = cur.d.total >= prev.d.total;
    const color = naik ? 'var(--sage)' : '#C4302B';
    lineSegments += `<line x1="${prev.x.toFixed(1)}" y1="${prev.y.toFixed(1)}" x2="${cur.x.toFixed(1)}" y2="${cur.y.toFixed(1)}" stroke="${color}" stroke-width="2.4"></line>`;
  }
  const dotsAndLabels = points.map(p=>`
    <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.4" fill="#fff" stroke="var(--navy)" stroke-width="2.2"></circle>
    <text x="${p.x.toFixed(1)}" y="${(p.y-9).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="600" fill="var(--navy)" font-family="Inter,sans-serif">${rupiahSingkat(p.d.total)}</text>`).join('');

  // Ringkasan tren dibandingkan bulan sebelumnya
  const last = data[data.length-1].total;
  const prevLast = data.length > 1 ? data[data.length-2].total : last;
  const trendUp = last >= prevLast;
  const deltaPct = prevLast ? Math.round(Math.abs(last-prevLast)/prevLast*100) : 0;
  const trendBadge = `<div style="display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:${trendUp?'var(--sage)':'#C4302B'};margin-bottom:8px;">
    <span>${trendUp?'▲':'▼'}</span><span>${trendUp?'Naik':'Turun'} ${deltaPct}% dari bulan lalu</span>
  </div>`;

  return trendBadge + `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;">${bars}${lineSegments}${dotsAndLabels}</svg>`;
}
function renderDonutChartSvg(segments){
  const total = segments.reduce((s,x)=>s+x.value, 0);
  if (!total) return `<div style="font-size:12px;color:var(--ink-soft);text-align:center;padding:30px 0;">Belum ada data</div>`;

  const cx = 85, cy = 58, rx = 66, ry = 34, depth = 16;
  const viewW = 170, viewH = cy + ry + depth + 12;
  const pt = (a) => [cx + rx * Math.cos(a), cy + ry * Math.sin(a)];

  let angle = -Math.PI / 2;
  const withAngles = segments.filter(s=>s.value>0).map(seg=>{
    const span = (seg.value / total) * Math.PI * 2;
    const a0 = angle, a1 = angle + span;
    angle = a1;
    return { ...seg, a0, a1 };
  });

  // Lapisan dinding (memberi kesan kedalaman/3D) — cuma bagian yang tampak di sisi depan (sudut 0..PI)
  const walls = withAngles.map(seg=>{
    const w0 = Math.max(seg.a0, 0), w1 = Math.min(seg.a1, Math.PI);
    if (w1 <= w0) return '';
    const [x0,y0] = pt(w0), [x1,y1] = pt(w1);
    const largeArc = (w1 - w0) > Math.PI ? 1 : 0;
    const path = `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${rx} ${ry} 0 ${largeArc} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} L ${x1.toFixed(1)} ${(y1+depth).toFixed(1)} A ${rx} ${ry} 0 ${largeArc} 0 ${x0.toFixed(1)} ${(y0+depth).toFixed(1)} Z`;
    return `<path d="${path}" fill="${seg.color}"></path><path d="${path}" fill="#000" opacity="0.22"></path>`;
  }).join('');

  // Lapisan atas (permukaan pie) — irisan elips, digambar terakhir supaya menutupi ujung dinding
  const lid = withAngles.map(seg=>{
    const [x0,y0] = pt(seg.a0), [x1,y1] = pt(seg.a1);
    const largeArc = (seg.a1 - seg.a0) > Math.PI ? 1 : 0;
    return `<path d="M ${cx} ${cy} L ${x0.toFixed(1)} ${y0.toFixed(1)} A ${rx} ${ry} 0 ${largeArc} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z" fill="${seg.color}" stroke="#fff" stroke-width="1.5"></path>`;
  }).join('');

  return `<svg viewBox="0 0 ${viewW} ${viewH}" style="width:170px;height:${viewH}px;flex-shrink:0;">${walls}${lid}</svg>`;
}
function renderDonutLegendHtml(segments){

    <span style="width:8px;height:8px;border-radius:50%;background:${s.color};flex-shrink:0;"></span>

}

function renderSparklineSvg(values, color){
  if (!values || values.filter(v=>v>0).length < 2) return '';
  const w = 130, h = 34, pad = 3;
  const max = Math.max(...values), min = Math.min(...values);
  const range = (max - min) || 1;
  const stepX = (w - pad*2) / (values.length - 1);
  const pts = values.map((v,i)=>[pad + i*stepX, h - pad - ((v-min)/range) * (h - pad*2)]);
  let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i=1;i<pts.length;i++){
    const [x0,y0] = pts[i-1], [x1,y1] = pts[i];
    const mx = (x0+x1)/2, my = (y0+y1)/2;
    d += ` Q ${x0.toFixed(1)} ${y0.toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)}`;
  }
  d += ` T ${pts[pts.length-1][0].toFixed(1)} ${pts[pts.length-1][1].toFixed(1)}`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;margin-top:10px;display:block;"><path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>`;
}
function renderStatCardHtml(opts, paletteIdx){
  const { label, value, icon, deltaText, deltaUp, sparkline } = opts;
  const pal = STAT_CARD_PALETTE[paletteIdx % STAT_CARD_PALETTE.length];
  const deltaHtml = deltaText ? `<div style="font-size:11px;font-weight:600;color:${deltaUp?'#2FA36B':'#C0392B'};margin-top:6px;display:flex;align-items:center;gap:4px;">
      <span>${deltaUp?'↗':'↘'}</span><span>${deltaText}</span>
    </div>` : '';
  return `<div class="card" style="background:${pal.bg};border-color:${pal.bg};padding:14px 16px;">
    <div style="display:flex;align-items:center;gap:12px;">
      <div style="width:34px;height:34px;border-radius:50%;background:${pal.color};color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;">${icon}</div>
      <div style="min-width:0;flex:1;">
        <div style="font-size:10.5px;font-weight:600;color:${pal.color};text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${label}</div>

function openDocumentForm(mode, id){
  state.documentForm.open = true;
  state.documentForm.mode = mode;
  state.documentForm.originalId = id || null;
  state.documentForm.fileData = null;
  state.documentForm.mimeType = null;
  state.documentForm.jenis = null;
  state.documentForm.ukuran = null;
  state.documentForm.namaFileAsli = null;
  render();
  if (mode === 'edit'){
    const doc = MOCK_DOCUMENTS.find(d=>d.id===id);
    document.getElementById('df-namaDokumen').value = doc.namaDokumen || doc.namaFile || '';
    document.getElementById('df-milik').value = doc.milik || (doc.clientId ? 'Klien' : 'Kantor');
    toggleDocumentMilikFields();
    if (doc.clientId) document.getElementById('df-clientId').value = doc.clientId;
  }
}
function closeDocumentForm(){
  state.documentForm.open = false;
  render();
}
function viewDocument(id){
  const doc = MOCK_DOCUMENTS.find(d=>d.id===id);
  if (!doc || !doc.fileData){
    alert('Pratinjau tidak tersedia — dokumen ini adalah data contoh tanpa file asli yang diunggah.');
    return;
  }
  window.open(doc.fileData, '_blank');
}
function toggleDocumentMilikFields(){
  const milik = document.getElementById('df-milik').value;
  const wrap = document.getElementById('df-client-wrap');
  if (wrap) wrap.style.display = milik === 'Klien' ? 'block' : 'none';
}
function handleDocumentFileChange(input){
  const file = input.files && input.files[0];
  if (!file) return;
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  let jenis = 'lainnya';
  if (['doc','docx'].includes(ext)) jenis = 'word';
  else if (['xls','xlsx','csv'].includes(ext)) jenis = 'excel';
  else if (ext === 'pdf') jenis = 'pdf';
  else if (['jpg','jpeg','png','gif','webp'].includes(ext)) jenis = 'gambar';

  const sizeKB = file.size / 1024;
  const ukuran = sizeKB > 1024 ? (sizeKB/1024).toFixed(1) + ' MB' : Math.round(sizeKB) + ' KB';

  const reader = new FileReader();
  reader.onload = (e) => {
    state.documentForm.fileData = e.target.result;
    state.documentForm.mimeType = file.type || 'application/octet-stream';
    state.documentForm.jenis = jenis;
    state.documentForm.ukuran = ukuran;
    state.documentForm.namaFileAsli = file.name;
    const preview = document.getElementById('df-file-preview');
    if (preview) preview.innerHTML = `${documentTypeIcon(jenis)}${file.name} <span style="color:var(--ink-soft);">(${ukuran})</span>`;
  };
  reader.readAsDataURL(file);
}
let sedangMenyimpanDokumen = false;
async function handleDocumentFormSubmit(ev){
  ev.preventDefault();
  if (sedangMenyimpanDokumen) return;
  const namaDokumen = getFieldVal('df-namaDokumen');
  const milik = getFieldVal('df-milik');
  const clientId = milik === 'Klien' ? getFieldVal('df-clientId') : '';

  if (!namaDokumen){ alert('Nama dokumen wajib diisi'); return; }
  if (milik === 'Klien' && !clientId){ alert('Pilih klien pemilik dokumen'); return; }

  sedangMenyimpanDokumen = true;
  tampilkanProgress('Mengunggah dokumen...');
  try {
    let resp;
    if (state.documentForm.mode === 'add'){
      if (!state.documentForm.fileData){ alert('Pilih file untuk diunggah'); sedangMenyimpanDokumen = false; sembunyikanProgress(); return; }
      resp = await callBackendUtama('addDocument', { document: {
        namaDokumen, milik: milik || 'Kantor', clientId,
        jenis: state.documentForm.jenis, ukuran: state.documentForm.ukuran,
        namaFileAsli: state.documentForm.namaFileAsli, fileBase64: state.documentForm.fileData,
        mimeType: state.documentForm.mimeType || '', diunggahOleh: state.session.email,
      }});
    } else {
      resp = await callBackendUtama('updateDocument', { document: {
        id: state.documentForm.originalId, namaDokumen, milik: milik || 'Kantor', clientId,
        jenis: state.documentForm.jenis, ukuran: state.documentForm.ukuran,
        namaFileAsli: state.documentForm.namaFileAsli,
        fileBase64: state.documentForm.fileData || undefined, mimeType: state.documentForm.mimeType || '',
      }});
    }
    if (!resp.success) throw new Error(resp.message || 'Gagal menyimpan.');

    logActivity(state.documentForm.mode === 'add' ? 'Unggah Dokumen' : 'Ubah Dokumen', namaDokumen);
    await muatUlangDaftarDokumen();
    closeDocumentForm();
  } catch (err) {
    alert('Gagal menyimpan dokumen: ' + err.message);
  } finally {
    sedangMenyimpanDokumen = false;
    sembunyikanProgress();
  }
}
async function deleteDocument(id){
  if (!confirm('Hapus dokumen ini? Tindakan tidak dapat dibatalkan.')) return;
  const doc = MOCK_DOCUMENTS.find(d=>d.id===id);
  tampilkanProgress('Menghapus dokumen...');
  try {
    const resp = await callBackendUtama('deleteDocument', { id });
    if (!resp.success) throw new Error(resp.message || 'Gagal menghapus.');
    logActivity('Hapus Dokumen', doc ? (doc.namaDokumen||doc.namaFile) : id);
    await muatUlangDaftarDokumen();
    render();
  } catch (err) {
    alert('Gagal menghapus dokumen: ' + err.message);
  } finally {
    sembunyikanProgress();
  }
}

function rupiah(n){ return 'Rp ' + Number(n||0).toLocaleString('id-ID'); }

function addInvoiceItemRow(){
  state.invoiceForm.items.push({ deskripsi:'', qty:1, harga:0 });
  render();
}
function removeInvoiceItemRow(idx){
  if (state.invoiceForm.items.length <= 1){ alert('Minimal harus ada 1 item'); return; }
  state.invoiceForm.items.splice(idx, 1);
  render();
}
function updateInvoiceItemField(idx, field, value){
  state.invoiceForm.items[idx][field] = field === 'deskripsi' ? value : Number(value) || 0;
  if (field !== 'deskripsi'){
    const it = state.invoiceForm.items[idx];
    const subtotal = (Number(it.qty)||0) * (Number(it.harga)||0);
    const cell = document.getElementById('if-subtotal-'+idx);
    if (cell) cell.textContent = rupiah(subtotal);
    updateInvoiceTotalDisplay();
  }
}
function updateInvoiceTotalDisplay(){
  const el = document.getElementById('if-total-breakdown');
  if (el) el.innerHTML = renderInvoiceTotalBreakdownHtml(getInvoiceFormTotal(), state.invoiceForm.kenaPPh23);
}
function getInvoiceFormTotal(){
  return state.invoiceForm.items.reduce((s,it)=>s + (Number(it.qty)||0)*(Number(it.harga)||0), 0);
}
function renderInvoiceTotalBreakdownHtml(total, kenaPPh23){
  if (!kenaPPh23){
    return `<div style="font-size:15px;font-weight:600;color:var(--navy);">Total: ${rupiah(total)}</div>`;
  }
  const pph = Math.round(total * 0.02);
  const tagihan = total - pph;
  return `<div style="min-width:240px;font-size:13px;">
    <div style="display:flex;justify-content:space-between;padding:4px 0;color:var(--ink-soft);"><span>Total Jasa</span><span>${rupiah(total)}</span></div>
    <div style="display:flex;justify-content:space-between;padding:4px 0;color:var(--danger);"><span>Potongan PPh Pasal 23 (2%)</span><span>-${rupiah(pph)}</span></div>
    <div style="display:flex;justify-content:space-between;padding:6px 0;margin-top:4px;border-top:1px solid var(--border);font-weight:600;color:var(--navy);font-size:14.5px;"><span>Total Tagihan</span><span>${rupiah(tagihan)}</span></div>
  </div>`;
}
function toggleInvoicePPh23(){
  state.invoiceForm.kenaPPh23 = document.getElementById('if-kenaPPh23').checked;
  updateInvoiceTotalDisplay();
}
const ROMAN_MONTHS = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
// Hitung nomor urut invoice pada bulan+tahun tertentu (reset ke 1 tiap awal bulan baru)
function countInvoicesInMonth(year, month){
  return MOCK_INVOICES.filter(inv=>{
    const d = new Date(inv.tanggal + 'T00:00:00');
    return d.getFullYear() === year && d.getMonth() === month;
  }).length;
}
function generateInvoiceNumber(tanggal){
  const d = new Date(tanggal + 'T00:00:00');
  const seq = countInvoicesInMonth(d.getFullYear(), d.getMonth()) + 1;
  const kode = state.systemSettings.kodeInvoice || 'MS';
  return `${String(seq).padStart(2,'0')}/INV-${ROMAN_MONTHS[d.getMonth()]}/${kode}/${d.getFullYear()}`;
}
function openInvoiceForm(){
  state.invoiceForm.open = true;
  render();
}
function closeInvoiceForm(){
  state.invoiceForm.open = false;
  render();
}
let sedangMenyimpanInvoice = false;
async function handleCreateInvoice(){
  if (sedangMenyimpanInvoice) return;
  const clientId = document.getElementById('if-clientId').value;
  const tanggal = document.getElementById('if-tanggal').value;
  const metodePembayaran = document.getElementById('if-metodePembayaran').value;

  if (!clientId){ alert('Pilih klien terlebih dahulu'); return; }
  if (!tanggal){ alert('Isi tanggal invoice'); return; }
  const items = state.invoiceForm.items.filter(it => it.deskripsi.trim());
  if (!items.length){ alert('Isi minimal satu item tagihan (deskripsi tidak boleh kosong)'); return; }
  if (!metodePembayaran.trim()){ alert('Isi metode pembayaran'); return; }

  const invoice = {
    id: generateInvoiceNumber(tanggal),
    clientId, tanggal, items, metodePembayaran,
    kenaPPh23: state.invoiceForm.kenaPPh23,
    status: 'Belum Lunas',
    dibuatOleh: state.session.email,
  };

  sedangMenyimpanInvoice = true;
  tampilkanProgress('Membuat invoice...');
  try {
    const resp = await callBackendUtama('addInvoice', { invoice });
    if (!resp.success) throw new Error(resp.message || 'Gagal menyimpan.');

    logActivity('Buat Invoice', invoice.id);
    await muatUlangDaftarInvoice();
    state.invoiceForm = { open:false, clientId:'', tanggal:new Date().toISOString().slice(0,10), items:[{deskripsi:'',qty:1,harga:0}], metodePembayaran:'', kenaPPh23:false };
    alert(`Invoice ${invoice.id} berhasil diciptakan.`);
    render();
  } catch (err) {
    alert('Gagal membuat invoice: ' + err.message);
  } finally {
    sedangMenyimpanInvoice = false;
    sembunyikanProgress();
  }
}
async function toggleInvoiceStatus(id){
  const inv = MOCK_INVOICES.find(i=>i.id===id);
  const statusBaru = inv.status === 'Lunas' ? 'Belum Lunas' : 'Lunas';
  try {
    const resp = await callBackendUtama('updateInvoiceStatus', { id, status: statusBaru });
    if (!resp.success) throw new Error(resp.message || 'Gagal menyimpan.');
    inv.status = statusBaru;
    logActivity('Ubah Status Invoice', `${id} → ${inv.status}`);
    render();
  } catch (err) {
    alert('Gagal mengubah status invoice: ' + err.message);
  }
}
async function deleteInvoice(id){
  if (!confirm('Hapus invoice ini? Tindakan tidak dapat dibatalkan.')) return;
  tampilkanProgress('Menghapus invoice...');
  try {
    const resp = await callBackendUtama('deleteInvoice', { id });
    if (!resp.success) throw new Error(resp.message || 'Gagal menghapus.');
    logActivity('Hapus Invoice', id);
    await muatUlangDaftarInvoice();
    render();
  } catch (err) {
    alert('Gagal menghapus invoice: ' + err.message);
  } finally {
    sembunyikanProgress();
  }
}
function setInvoiceFilterBulan(v){ state.invoiceFilter.bulan = v; render(); }
function setInvoiceFilterTanggal(v){ state.invoiceFilter.tanggal = v; render(); }
function resetInvoiceFilter(){ state.invoiceFilter = { bulan:'', tanggal:'' }; render(); }
function exportInvoicesExcel(){
  const filtered = getFilteredInvoices(MOCK_INVOICES);
  const rows = filtered.map((inv, idx) => {
    const client = MOCK_CLIENTS.find(c=>c.id===inv.clientId);
    return {
      'No': idx + 1,
      'No. Invoice': inv.id,
      'Klien': client ? client.nama : '-',
      'Tanggal': formatDDMMYY(inv.tanggal),
      'Layanan': invoiceRingkasanLayanan(inv),
      'Total Jasa': invoiceTotal(inv),
      'Potongan PPh 23 (2%)': invoicePPh23(inv),
      'Total Tagihan': invoiceTagihan(inv),
      'Status': inv.status,
    };
  });
  exportRowsToExcel('Daftar_Invoice.xlsx', rows);
}

function getFilteredInvoices(list){
  return list.filter(inv=>{
    if (state.invoiceFilter.tanggal) return inv.tanggal === state.invoiceFilter.tanggal;
    if (state.invoiceFilter.bulan) return inv.tanggal.slice(0,7) === state.invoiceFilter.bulan;
    return true;
  });
}

function renderInvoiceItemRowsHtml(){
  return state.invoiceForm.items.map((it, idx) => `
    <tr>
      <td><input type="text" value="${it.deskripsi}" placeholder="Deskripsi layanan" oninput="updateInvoiceItemField(${idx},'deskripsi',this.value)" style="margin-bottom:0;"></td>
      <td style="width:70px;"><input type="number" min="1" value="${it.qty}" oninput="updateInvoiceItemField(${idx},'qty',this.value)" style="margin-bottom:0;"></td>
      <td style="width:150px;"><input type="number" min="0" value="${it.harga}" oninput="updateInvoiceItemField(${idx},'harga',this.value)" style="margin-bottom:0;"></td>
      <td id="if-subtotal-${idx}" style="width:140px;white-space:nowrap;">${rupiah((Number(it.qty)||0)*(Number(it.harga)||0))}</td>
      <td style="width:36px;text-align:center;"><span style="cursor:pointer;color:var(--danger);" onclick="removeInvoiceItemRow(${idx})" title="Hapus baris">&times;</span></td>
    </tr>`).join('');
}

        <div class="a5-width-box">

              <select id="if-clientId" onchange="state.invoiceForm.clientId=this.value; render();" style="width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-size:13.5px;margin-bottom:14px;">

function openInvoiceDocument(id){
  const inv = MOCK_INVOICES.find(i=>i.id===id);
  if (!inv) return;
  const html = buildInvoiceDocumentHtml(inv);
  const blob = new Blob([html], { type:'text/html' });
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
}

async function handleProfileFormSubmit(ev){
  ev.preventDefault();
  const whatsapp = getFieldVal('pf-whatsapp');
  const passwordBaru = getFieldVal('pf-password-baru');
  const passwordUlang = getFieldVal('pf-password-ulang');

  state.profileError = ''; state.profileSukses = '';
  if (passwordBaru || passwordUlang){
    if (passwordBaru.length < 6){ state.profileError = 'Password baru minimal 6 karakter.'; render(); return; }
    if (passwordBaru !== passwordUlang){ state.profileError = 'Password dan ulangi password tidak sama.'; render(); return; }
  }

  state.profileLoading = true; render();
  try {
    const payload = { email: state.session.email, whatsapp };
    if (passwordBaru) payload.password = passwordBaru;
    const data = await callBackendUtama('updateUser', { user: payload });
    state.profileLoading = false;
    if (!data.success){ state.profileError = data.message || 'Gagal menyimpan perubahan.'; render(); return; }

    const user = MOCK_USERS.find(u=>u.email===state.session.email);
    if (user) user.whatsapp = whatsapp;
    if (passwordBaru){
      state.session.perluGantiPassword = false; // password sudah diganti -> banner "wajib ganti password" langsung hilang
      logActivity('Ganti Password', 'Password akun diperbarui sendiri lewat menu Profil');
    }
    logActivity('Ubah Profil', 'Nomor WhatsApp diperbarui');
    state.profileSukses = 'Perubahan berhasil disimpan.';
    render();
  } catch (err) {
    state.profileLoading = false;
    state.profileError = 'Gagal terhubung ke server: ' + err.message;
    render();
  }
}

function getAllCalendarEvents(){
  const myEmail = state.session.email;
  const events = [];

  MOCK_JOBS.forEach(j=>{
    const mine = j.ditugaskanKe===myEmail || j.dibuatOleh===myEmail || j.approverEmail===myEmail;
    if (j.tanggalMulai) events.push({ tanggal:j.tanggalMulai, waktu:j.waktuMulai||'', tipe:'pekerjaan', judul:`Mulai: ${j.judul}`, target:'all_jobs', mine });
    if (j.tenggatWaktu) events.push({ tanggal:j.tenggatWaktu, waktu:'', tipe:'pekerjaan', judul:`Target Selesai: ${j.judul}`, target:'all_jobs', mine });
  });

  MOCK_REMINDERS.forEach(r=>{
    const client = MOCK_CLIENTS.find(c=>c.id===r.clientId);
    const namaKlien = client ? client.nama : 'Klien dihapus';
    const mine = !!(client && client.konsultanEmail === myEmail);
    if (r.tanggalMode === 'Bulan Ini Saja' && r.tanggalValue){
      events.push({ tanggal:r.tanggalValue, waktu:'', tipe:'reminder', judul:`Reminder: ${namaKlien}`, target:'reminder_settings', mine });
    } else if (r.tanggalMode === 'Setiap Tanggal Ini' && r.tanggalValue){
      // tampilkan kemunculan bulan berjalan & bulan depan di sekitar monthCursor
      const day = Number(r.tanggalValue);
      [0,1,-1].forEach(offset=>{
        const d = new Date(state.calendarView.monthCursor.getFullYear(), state.calendarView.monthCursor.getMonth()+offset, day);
        if (!isNaN(d)) events.push({ tanggal:d.toISOString().slice(0,10), waktu:'', tipe:'reminder', judul:`Reminder: ${namaKlien}`, target:'reminder_settings', mine });
      });
    }
  });

  MOCK_INVOICES.forEach(inv=>{
    const client = MOCK_CLIENTS.find(c=>c.id===inv.clientId);
    const mine = inv.dibuatOleh===myEmail || !!(client && client.konsultanEmail === myEmail);
    events.push({ tanggal:inv.tanggal, waktu:'', tipe:'invoice', judul:`Invoice ${inv.id} — ${client?client.nama:'-'}`, target:'keuangan', mine });
  });

  MOCK_CALENDAR_NOTES.forEach(n=>{
    const mine = n.dibuatOleh === myEmail;
    events.push({ tanggal:n.tanggal, waktu:n.waktu||'', tipe:'catatan', judul:n.judul, deskripsi:n.deskripsi, id:n.id, selesai:n.selesai, target:null, mine });
  });

  return events;
}
function getFilteredCalendarEvents(){

  if (state.calendarView.ownerFilter === 'saya') events = events.filter(e => e.mine);

let sedangMenyimpanCatatan = false;
async function handleCalendarNoteSubmit(ev){
  ev.preventDefault();
  if (sedangMenyimpanCatatan) return;
  const tanggal = getFieldVal('cn-tanggal');
  const waktu = getFieldVal('cn-waktu');
  const judul = getFieldVal('cn-judul');
  const deskripsi = getFieldVal('cn-deskripsi');
  if (!tanggal || !judul){ alert('Tanggal dan judul catatan wajib diisi'); return; }

  sedangMenyimpanCatatan = true;
  tampilkanProgress('Menyimpan catatan...');
  try {
    let resp;
    if (state.calendarView.noteForm.mode === 'add'){
      resp = await callBackendUtama('addCalendarNote', { note: { tanggal, waktu, judul, deskripsi, dibuatOleh: state.session.email, selesai: false } });
    } else {
      resp = await callBackendUtama('updateCalendarNote', { id: state.calendarView.noteForm.originalId, updates: { tanggal, waktu, judul, deskripsi } });
    }
    if (!resp.success) throw new Error(resp.message || 'Gagal menyimpan.');

    logActivity(state.calendarView.noteForm.mode === 'add' ? 'Tambah Catatan Kalender' : 'Ubah Catatan Kalender', judul);
    await muatUlangCatatanKalender();
    closeCalendarNoteForm();
  } catch (err) {
    alert('Gagal menyimpan catatan: ' + err.message);
  } finally {
    sedangMenyimpanCatatan = false;
    sembunyikanProgress();
  }
}

function renderAgendaView(){
  const events = getFilteredCalendarEvents();
  const todayStr = REMINDER_TODAY.toISOString().slice(0,10);
  // rentang tampil: 14 hari ke belakang (yang lewat) s.d. 60 hari ke depan
  const rangeStart = new Date(REMINDER_TODAY); rangeStart.setDate(rangeStart.getDate()-14);
  const rangeEnd = new Date(REMINDER_TODAY); rangeEnd.setDate(rangeEnd.getDate()+60);
  const inRange = events.filter(e=>{
    const d = new Date(e.tanggal+'T00:00:00');
    return d >= rangeStart && d <= rangeEnd;
  }).sort((a,b)=> a.tanggal===b.tanggal ? (a.waktu||'').localeCompare(b.waktu||'') : a.tanggal.localeCompare(b.tanggal));

  if (!inRange.length){
    return `<div class="empty">Tidak ada agenda pada rentang ini. Coba aktifkan lebih banyak filter, atau tambah catatan baru.</div>`;
  }

  const grouped = {};
  inRange.forEach(e=>{ (grouped[e.tanggal] = grouped[e.tanggal] || []).push(e); });

  const dayNames = ['Minggu','Senin','Selasa','Rabu','Kamis',"Jumat",'Sabtu'];
  const monthNames = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

  return Object.keys(grouped).sort().map(tgl=>{
    const d = new Date(tgl+'T00:00:00');
    const isToday = tgl === todayStr;
    const isPast = tgl < todayStr;
    const itemsHtml = grouped[tgl].map(e=>{
      const color = CALENDAR_TYPE_COLORS[e.tipe];

function renderMonthView(){
  const events = getFilteredCalendarEvents();
  const cursor = state.calendarView.monthCursor;
  const year = cursor.getFullYear(), month = cursor.getMonth();
  const monthNames = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay(); // 0=Minggu
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = REMINDER_TODAY.toISOString().slice(0,10);

  const eventsByDate = {};
  events.forEach(e=>{ (eventsByDate[e.tanggal] = eventsByDate[e.tanggal] || []).push(e); });

  const cells = [];
  for (let i=0;i<startOffset;i++) cells.push('<div></div>');
  for (let day=1; day<=daysInMonth; day++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const dayEvents = eventsByDate[dateStr] || [];
    const isToday = dateStr === todayStr;
    const isSelected = state.calendarView.selectedDate === dateStr;
    const dots = dayEvents.slice(0,4).map(e=>`<span style="width:5px;height:5px;border-radius:50%;background:${CALENDAR_TYPE_COLORS[e.tipe]};"></span>`).join('');
    cells.push(`<div onclick="selectCalendarDate('${dateStr}')" style="cursor:pointer;padding:8px 4px;border-radius:8px;text-align:center;background:${isSelected?'var(--gold-soft)':(isToday?'var(--bg)':'transparent')};border:${isToday?'1.5px solid var(--gold)':'1px solid transparent'};">
      <div style="font-size:12.5px;font-weight:${isToday?'700':'500'};color:${isToday?'var(--navy)':'var(--ink)'};">${day}</div>
      <div style="display:flex;justify-content:center;gap:2px;margin-top:3px;min-height:5px;">${dots}</div>
    </div>`);
  }

  const dayHeaders = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(d=>`<div style="font-size:10.5px;color:var(--ink-soft);text-align:center;font-weight:600;">${d}</div>`).join('');

  const selectedDetailHtml = state.calendarView.selectedDate ? (() => {
    const dayEvents = (eventsByDate[state.calendarView.selectedDate] || []).sort((a,b)=>(a.waktu||'').localeCompare(b.waktu||''));
    const d = new Date(state.calendarView.selectedDate+'T00:00:00');
    const dayNames = ['Minggu','Senin','Selasa','Rabu','Kamis',"Jumat",'Sabtu'];
    const label = `${dayNames[d.getDay()]}, ${d.getDate()} ${monthNames[d.getMonth()]} ${d.getFullYear()}`;
    const itemsHtml = dayEvents.length ? dayEvents.map(e=>{
      const color = CALENDAR_TYPE_COLORS[e.tipe];
      const clickable = e.target ? `onclick="setModule('${e.target}')" style="cursor:pointer;"` : '';
      const doneWrapStyle = e.selesai ? 'background:#E5EFE3;opacity:.72;border-radius:8px;padding:8px;' : 'padding:8px 0;border-bottom:1px solid var(--border);';
      const doneTextStyle = e.selesai ? 'text-decoration:line-through;color:var(--ink-soft);' : '';
      return `<div ${clickable} style="display:flex;gap:10px;${doneWrapStyle}">
        <div style="width:8px;height:8px;border-radius:50%;background:${e.selesai?'var(--sage)':color};flex-shrink:0;margin-top:5px;"></div>
        <div><div style="font-size:13px;font-weight:500;${doneTextStyle}">${e.judul}</div><div style="font-size:10.5px;color:var(--ink-soft);margin-top:2px;">${CALENDAR_TYPE_LABELS[e.tipe]}${e.waktu?` &middot; ${e.waktu}`:''}${e.selesai?' &middot; Selesai':''}</div></div>
      </div>`;
    }).join('') : `<div style="color:var(--ink-soft);font-size:12.5px;">Tidak ada agenda pada tanggal ini.</div>`;
    return `<div style="background:var(--gold-soft);border:1px solid var(--border);border-radius:10px;padding:18px;margin-top:16px;">
      <div class="section-title" style="font-size:13.5px;">${label}</div>
      ${itemsHtml}
    </div>`;
  })() : '';

  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <button class="btn-secondary" onclick="shiftCalendarMonth(-1)">&laquo;</button>
      <div style="font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--navy);">${monthNames[month]} ${year}</div>
      <button class="btn-secondary" onclick="shiftCalendarMonth(1)">&raquo;</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;">${dayHeaders}</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">${cells.join('')}</div>
  </div>
  ${selectedDetailHtml}`;
}

// Ambil tanggal-waktu commit TERAKHIR untuk index.html langsung dari GitHub API —
// otomatis akurat, tidak perlu diisi manual lagi. Kalau gagal (offline/repo privat/dibuka
// dari file lokal tanpa internet), diam-diam biarkan fallback ke RILIS_UPDATE_LOG di atas.
let updateTerakhirDariGithub = null;
async function ambilUpdateTerakhirDariGithub(){
  try {
    const res = await fetch('https://api.github.com/repos/jundicomp/pkp/commits?path=index.html&per_page=1');
    if (!res.ok) return;
    const data = await res.json();
    if (Array.isArray(data) && data[0] && data[0].commit && data[0].commit.committer && data[0].commit.committer.date){
      const tglUTC = new Date(data[0].commit.committer.date);
      const tglWIB = new Date(tglUTC.getTime() + 7*60*60*1000); // GitHub kasih UTC, geser +7 jam jadi WIB
      const dd = String(tglWIB.getUTCDate()).padStart(2,'0');
      const mm = String(tglWIB.getUTCMonth()+1).padStart(2,'0');
      const yy = String(tglWIB.getUTCFullYear()).slice(-2);
      const hh = String(tglWIB.getUTCHours()).padStart(2,'0');
      const mi = String(tglWIB.getUTCMinutes()).padStart(2,'0');
      updateTerakhirDariGithub = `${dd}-${mm}-${yy}, ${hh}:${mi} WIB`;
      render();
    }
  } catch (err) { /* diam-diam gagal — sidebar tetap tampil, cuma pakai data manual sebagai cadangan */ }
}
ambilUpdateTerakhirDariGithub();

// URL Web App "Penjaga Lisensi" — sungguhan, dipanggil saat verifikasi serial number
const WEBAPP_URL_LISENSI = 'https://script.google.com/macros/s/AKfycbwmD05bA93NU4N43yLD-tauJGowV7EnLxpC4McVfV0lQDtJ_yqzgXeBbwv1nuF2FaQ/exec';

async function verifySerialNumber(){
  const w = state.setupWizard;
  w.namaAktivator = getFieldVal('sw-nama-aktivator').trim();
  w.emailAktivator = getFieldVal('sw-email-aktivator').trim();
  w.passwordAdmin = getFieldVal('sw-password-admin');
  w.passwordAdminUlang = getFieldVal('sw-password-admin-ulang');
  w.serialNumber = getFieldVal('sw-serial').trim().toUpperCase();
  const jawabanCaptcha = Number(getFieldVal('sw-captcha'));
  const soal = state.captchaWizard;

  if (!w.namaAktivator || !w.emailAktivator){ w.serialError = 'Nama dan email Anda wajib diisi (untuk bukti aktivasi).'; render(); return; }
  if (!w.passwordAdmin || w.passwordAdmin.length < 6){ w.serialError = 'Password admin minimal 6 karakter.'; render(); return; }
  if (w.passwordAdmin !== w.passwordAdminUlang){ w.serialError = 'Password dan ulangi password tidak sama.'; render(); return; }
  if (!w.serialNumber){ w.serialError = 'Masukkan serial number terlebih dahulu.'; render(); return; }
  if (jawabanCaptcha !== soal.a + soal.b){ w.serialError = 'Jawaban soal keamanan salah, coba lagi.'; buatUlangCaptcha('captchaWizard'); render(); return; }

  w.loading = true; w.serialError = ''; render();

  try {
    const res = await fetch(WEBAPP_URL_LISENSI, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // hindari CORS preflight
      body: JSON.stringify({ action: 'recordLicenseActivation', serialNumber: w.serialNumber, namaAktivator: w.namaAktivator, emailAktivator: w.emailAktivator, backendUrl: WEBAPP_URL_UTAMA }),
    });
    const data = JSON.parse(await res.text());

    if (data.valid){
      w.serialValid = true;
      w.serialInfo = {
        namaKantor: data.namaKantor,
        produk: data.produk,
        tipeLisensi: data.tipeLisensi || 'Seumur Hidup',
        berlakuSampai: data.tanggalKadaluarsa || '(Seumur Hidup)',
      };
      // Aktivasi valid — simpan backend URL kantor ini ke localStorage device ini,
      // supaya kunjungan berikutnya (refresh, buka tab baru) tidak perlu isi ulang.
      try { localStorage.setItem('pkp_backend_url', WEBAPP_URL_UTAMA); } catch(e){}

      // Serial number valid — sekarang buat akun Superadmin pertama di Sheet KANTOR INI
      // sendiri (bukan di Sheet Penjaga Lisensi). Kalau gagal, tetap lanjut ke Langkah 2
      // supaya pembeli tidak "terjebak" — tapi beri tahu jelas supaya bisa lapor manual.
      try {
        const hasilAdmin = await callBackendUtama('buatSuperadminPertama', {
          nama: w.namaAktivator, email: w.emailAktivator, password: w.passwordAdmin,
        });
        w.adminBerhasilDibuat = hasilAdmin.success;
        w.adminPesan = hasilAdmin.message;
      } catch (err) {
        w.adminBerhasilDibuat = false;
        w.adminPesan = 'Gagal terhubung ke server aplikasi: ' + err.message;
      }

      w.loading = false;
      w.step = 2;
    } else {
      w.loading = false;
      w.serialValid = false; w.serialInfo = null;
      w.serialError = data.message || 'Serial number tidak valid.';
      buatUlangCaptcha('captchaWizard');
    }
  } catch (err) {
    w.loading = false;
    w.serialValid = false; w.serialInfo = null;
    w.serialError = 'Gagal menghubungi server lisensi: ' + err.message + '. Periksa koneksi internet Anda dan coba lagi.';

async function handleEmailGerbangSubmit(ev){
  ev.preventDefault();
  const email = document.getElementById('eg-email').value.trim();
  const jawabanCaptcha = Number(document.getElementById('eg-captcha').value);
  const soal = state.captchaGerbang;

  if (jawabanCaptcha !== soal.a + soal.b){
    state.error = 'Jawaban soal keamanan salah, coba lagi.';
    buatUlangCaptcha('captchaGerbang');
    render();
    return;
  }

  state.emailGerbang = email;
  state.error = ''; state.loading = true; render();

  // Langkah 1: kantor (Sheet ini) sudah pernah aktivasi lisensi atau belum?
  if (!state.systemSettings.serialNumber){
    state.loading = false;
    state.gatePage = 'ajakanAktivasi';
    render();
    return;
  }

  // Langkah 2: sudah aktivasi — cek apakah email ini terdaftar sebagai user kantor ini
  try {
    const data = await callBackendUtama('checkEmailExists', { email });
    state.loading = false;
    if (data.success && data.exists){
      state.gatePage = 'login';
    } else {
      state.gatePage = 'belumTerdaftar';
    }
  } catch (err) {
    state.loading = false;
    state.error = 'Gagal terhubung ke server: ' + err.message;
    buatUlangCaptcha('captchaGerbang');
  }
  render();
}

// ============================================================
// PROGRESS BAR OVERLAY — dipakai saat proses CRUD (simpan/hapus data) yang
// makan waktu, supaya user tahu aplikasi sedang bekerja, bukan macet.
// Bar mengisi cepat di awal lalu melambat mendekati 90% (belum pernah
// sampai 100% sebelum prosesnya BENAR-BENAR selesai) — efek psikologis
// meyakinkan tanpa berbohong soal progres sungguhan.
// ============================================================
let _progressBarInterval = null;
let _progressSafetyTimeout = null;
function tampilkanProgress(pesan){
  let overlay = document.getElementById('progress-overlay');
  if (!overlay){
    overlay = document.createElement('div');
    overlay.id = 'progress-overlay';
    overlay.className = 'progress-overlay';
    overlay.innerHTML = `<div class="progress-bar-track terang"><div class="progress-bar-fill" id="progress-bar-fill"></div></div><div class="progress-overlay-text" id="progress-overlay-text"></div><div class="progress-overlay-persen" id="progress-overlay-persen"></div>`;
    document.body.appendChild(overlay);
  }
  overlay.style.display = 'flex';
  document.getElementById('progress-overlay-text').textContent = pesan || 'Memproses...';
  const fill = document.getElementById('progress-bar-fill');
  const persenEl = document.getElementById('progress-overlay-persen');
  fill.style.width = '0%';
  let persen = 0;
  clearInterval(_progressBarInterval);
  _progressBarInterval = setInterval(() => {
    persen += (90 - persen) * 0.15;
    const tampil = Math.min(persen, 90);
    fill.style.width = tampil + '%';
    if (persenEl) persenEl.textContent = Math.round(tampil) + '%';
  }, 150);
  // Jaring pengaman — kalau karena sebab apa pun sembunyikanProgress() tidak
  // sempat terpanggil, overlay ini otomatis hilang sendiri setelah 20 detik,
  // supaya TIDAK PERNAH menutupi layar selamanya walau ada bug di kode lain.
  clearTimeout(_progressSafetyTimeout);
  _progressSafetyTimeout = setTimeout(() => { sembunyikanProgress(); }, 20000);
}
function sembunyikanProgress(){
  clearInterval(_progressBarInterval);
  clearTimeout(_progressSafetyTimeout);
  const fill = document.getElementById('progress-bar-fill');
  const persenEl = document.getElementById('progress-overlay-persen');
  if (fill) fill.style.width = '100%';
  if (persenEl) persenEl.textContent = '100%';
  setTimeout(() => {
    const overlay = document.getElementById('progress-overlay');
    if (overlay) overlay.style.display = 'none';
  }, 220);
}

let chatPollingIntervalId = null;
function mulaiPollingChat(){
  if (chatPollingIntervalId) return; // sudah jalan, jangan dobel
  chatPollingIntervalId = setInterval(cekPesanBaru, 6000); // cek tiap 6 detik selama kotak chat terbuka
}
function hentikanPollingChat(){
  if (chatPollingIntervalId){ clearInterval(chatPollingIntervalId); chatPollingIntervalId = null; }
}
async function cekPesanBaru(){
  if (!state.session || !state.chatPopupOpen) { hentikanPollingChat(); return; }
  try {
    const data = await callBackendUtama('getAllMessages');
    if (!data.success) return;
    const idSudahAda = new Set(MOCK_MESSAGES.map(m=>m.id));
    const pesanBaru = data.messages.filter(m => !idSudahAda.has(m.id));
    if (!pesanBaru.length) return;

    let adaMasukUntukSaya = false;
    pesanBaru.forEach(m => {
      const sudahDibaca = m.read === 'TRUE' || m.read === true;
      // kalau sedang lihat percakapan ini, otomatis anggap terbaca di layar (walau di Sheet mungkin belum ditandai)
      const sedangDilihat = state.chatView.activeWith === m.from && m.to === state.session.email;
      MOCK_MESSAGES.push({ ...m, read: sudahDibaca || sedangDilihat });
      if (m.to === state.session.email && !sudahDibaca) adaMasukUntukSaya = true;
    });

    if (adaMasukUntukSaya) playNotifSound(880);
    render();
    if (state.chatView.activeWith) scrollChatToBottom();
    // kalau ada pesan baru masuk untuk percakapan yang sedang dibuka, tandai terbaca di Sheet juga
    const perluTandaiTerbaca = pesanBaru.some(m => state.chatView.activeWith === m.from && m.to === state.session.email);
    if (perluTandaiTerbaca){
      callBackendUtama('markMessagesRead', { fromEmail: state.chatView.activeWith, toEmail: state.session.email }).catch(()=>{});
    }
  } catch (err) { /* diam-diam gagal, coba lagi di siklus berikutnya */ }
}

function scrollChatToBottom(){

function sendChatMessage(ev){
  if (ev) ev.preventDefault();
  const input = document.getElementById('chat-msg-input');
  const text = input.value.trim();
  if (!text) return;
  const to = state.chatView.activeWith;
  const myEmail = state.session.email;
  const timestamp = new Date().toISOString();
  MOCK_MESSAGES.push({ id:'MSG-'+String(MESSAGE_SEQ++).padStart(5,'0'), from:myEmail, to, text, timestamp, read:true });
  playNotifSound(660);
  const recipient = MOCK_USERS.find(u=>u.email===to);
  logActivity('Kirim Pesan', `Ke ${recipient ? recipient.nama : to}`);
  input.value = '';
  render();
  scrollChatToBottom();

  // Simpan pesan SUNGGUHAN ke Sheet di latar belakang (tidak ditunggu — tetap terasa instan)
  callBackendUtama('sendMessage', { message: { from: myEmail, to, text, timestamp, read: true } }).catch(()=>{});

  // Simulasi real-time: kalau penerima "online", balasan otomatis muncul setelah beberapa detik.
  // CATATAN: balasan ini cuma simulasi tampilan, TIDAK disimpan ke Sheet (bukan pesan sungguhan dari orang lain).
  if (recipient && isUserOnlineNow(recipient)){
    const delay = 1800 + Math.random()*2400;
    setTimeout(()=>{
      const replies = ['Baik, siap.', 'Oke, saya cek dulu ya.', 'Terima kasih infonya!', 'Noted, akan segera saya tindak lanjuti.', 'Sip, ditunggu.', 'Baik, akan saya kabari lagi.'];
      const reply = replies[Math.floor(Math.random()*replies.length)];
      const isViewingThisChat = state.chatPopupOpen && state.chatView.activeWith === to;
      MOCK_MESSAGES.push({ id:'MSG-'+String(MESSAGE_SEQ++).padStart(5,'0'), from:to, to:myEmail, text:reply, timestamp:new Date().toISOString(), read:isViewingThisChat });
      playNotifSound(880);
      render();
      if (isViewingThisChat) scrollChatToBottom();
    }, delay);
  }
}

// Dengan begini, setelah berhasil, address bar browser sudah berisi link
// LENGKAP yang bisa langsung di-bookmark untuk akses berikutnya.
// Dipanggil dari tombol "Lanjutkan" di halaman "Selamat Datang" (gerbang email
// pembelian). Cari email ini di Sheet Lisensi:
// - Tidak ketemu sama sekali -> "Email Belum Terdaftar" (hubungi WhatsApp)
// - Ketemu + backendUrl SUDAH ada -> device ini langsung terhubung (kantor
//   sudah pernah aktivasi di device lain sebelumnya)
// - Ketemu + backendUrl BELUM ada -> ini pertama kalinya, arahkan ke layar
//   "Konfigurasi Lisensi" untuk paste URL backend hasil Deploy kantor sendiri
async function cariBackendViaEmail(){
  const email = document.getElementById('input-email-registrasi').value.trim().toLowerCase();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    alert('Masukkan email yang valid.');
    return;
  }
  state.emailLookupLoading = true; render();
  try {
    const res = await fetch(WEBAPP_URL_LISENSI, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // hindari CORS preflight
      body: JSON.stringify({ action: 'getBackendUrlByEmail', email }),
    });
    const data = JSON.parse(await res.text());
    state.emailLookupLoading = false;

    if (!data.success){
      state.emailLookupTried = email;
      state.emailLookupNotFound = true;
      render();
      return;
    }

    state.emailRegistrasiInfo = { email, serialNumber: data.serialNumber || '', namaKantor: data.namaKantor || '' };

    if (data.backendUrl){
      // Kantor ini sudah pernah aktivasi (di device lain) — langsung terhubung.
      WEBAPP_URL_UTAMA = data.backendUrl;
      try { localStorage.setItem('pkp_backend_url', data.backendUrl); } catch(e){}
      state.bootErrorType = null;
      mulaiAplikasi();
    } else {
      // Baru pertama kali — arahkan ke layar isi URL backend hasil Deploy sendiri.
      state.bootErrorType = 'konfigurasi_lisensi';
      render();
    }
  } catch (err) {
    state.emailLookupLoading = false;
    alert('Gagal memeriksa email: ' + err.message + '. Periksa koneksi internet lalu coba lagi.');
    render();
  }
}

// Dipanggil dari tombol "Lanjutkan" di layar "Konfigurasi Lisensi" — pembeli
// paste URL Web App hasil Deploy Apps Script mereka sendiri di sini. URL ini
// dipakai untuk sisa proses aktivasi (Wizard), dan otomatis tersimpan ke Sheet
// Lisensi begitu Wizard Step 1 berhasil (lihat lanjutkanWizardSerial()).
function lanjutkanKonfigurasiLisensi(){
  const nilai = document.getElementById('input-url-backend').value.trim();
  if (!nilai || !nilai.startsWith('https://script.google.com/') || !nilai.endsWith('/exec')){
    alert('URL yang dimasukkan sepertinya belum benar. Pastikan formatnya diawali "https://script.google.com/macros/s/..." dan diakhiri "/exec".');
    return;
  }
  WEBAPP_URL_UTAMA = nilai;
  state.bootErrorType = null;
  openSetupWizard();
}

async function mulaiAplikasi(){
  if (!WEBAPP_URL_UTAMA){
    state.bootLoading = false;
    state.bootErrorType = 'email_lookup';
    render();
    return;
  }
  state.bootError = null;
  state.bootLoading = true;
  window._bootProgressStarted = false;
  render();
  try {
    const data = await callBackendUtama('getSystemSettings');
    if (data.success && data.settings){
      Object.assign(state.systemSettings, data.settings);
    }
  } catch (err) {
    // PENTING: jangan diam-diam anggap "belum aktivasi" kalau ini cuma gagal
    // koneksi sesaat — itu bisa salah mengarahkan kantor yang SUDAH aktivasi
    // balik ke Wizard lagi. Tampilkan error + tombol coba lagi sebagai gantinya.
    state.bootError = 'Gagal terhubung ke server: ' + err.message;
    state.bootErrorType = 'connection_failed';
    state.bootLoading = false;
    if (window._bootProgressInterval) clearInterval(window._bootProgressInterval);
    render();
    return;
  }

  // Kalau kantor ini belum aktivasi, langsung arahkan ke layar "Aplikasi Belum
  // Diaktivasi" — tidak perlu minta isi ulang Gerbang Email staff dulu (percuma,
  // toh ujung-ujungnya diarahkan ke sini juga kalau belum aktivasi).
  if (!state.systemSettings.serialNumber){
    state.gatePage = 'ajakanAktivasi';
  }

  // Muat matriks akses modul (Administrasi > Modul) SEBELUM login — supaya begitu
  // ada yang login, sidebar-nya langsung sesuai toggle yang tersimpan di Sheet.
  try { await api.getAllModules(); } catch (err) { /* kalau gagal, pakai default statis */ }

  // Pulihkan sesi kalau ada (misal karena halaman di-refresh) — supaya TIDAK otomatis
  // logout tiap kali refresh. sessionStorage sengaja dipakai (bukan localStorage):
  // otomatis terhapus begitu tab/browser ditutup, jadi tetap aman untuk device bersama.
  try {
    const sesiTersimpan = sessionStorage.getItem('portalSession');
    if (sesiTersimpan){
      const user = JSON.parse(sesiTersimpan);
      await muatSemuaDataAplikasi(user.email);
      state.session = user;
      state.modules = api._modulesForRole(user.role);
      state.activeModule = state.modules[0] ? state.modules[0].id : null;
      mulaiPengawasanIdle();
      mulaiTimerTopbar();
      tampilkanKutipanBaru();
    }
  } catch (err) { /* kalau gagal pulihkan sesi, biarkan lanjut ke alur login normal */ }

  state.bootLoading = false;
  if (window._bootProgressInterval) clearInterval(window._bootProgressInterval);
  render();
}
// ============================================================
// ANIMASI WARNA LATAR — tiap kali tombol utama di layar login/gerbang/wizard
// diklik, warna latar navy berubah perlahan ke warna acak (transisi diatur
// lewat CSS .login-wrap di atas). Pakai event delegation di document supaya
// otomatis berlaku untuk SEMUA tombol .primary di dalam .login-box, termasuk
// yang baru ditambahkan nanti — tidak perlu edit tiap handler satu-satu.
// ============================================================
const PALET_WARNA_LATAR_ACAK = ['#1B2A4A','#2C1B4A','#1B4A3A','#4A1B2E','#1B3A4A','#4A3A1B','#2A1B4A','#1B4A46','#4A1B1B','#22345E','#3A1B4A','#1B2E4A'];

// Easter egg tersembunyi — klik area logo/nama kantor di sidebar untuk ganti
// warna latar sidebar secara acak. Sengaja TIDAK ada indikasi visual apa pun
// (tidak ada cursor:pointer, tidak ada hover effect) — supaya benar-benar jadi
// kejutan kecil yang cuma ketemu kalau iseng klik di situ.
let warnaSidebarSaatIni = null;
function acakWarnaSidebar(){
  let warnaBaru;
  do { warnaBaru = PALET_WARNA_LATAR_ACAK[Math.floor(Math.random() * PALET_WARNA_LATAR_ACAK.length)]; }
  while (warnaBaru === warnaSidebarSaatIni && PALET_WARNA_LATAR_ACAK.length > 1);
  warnaSidebarSaatIni = warnaBaru;
  document.documentElement.style.setProperty('--sidebar-bg', warnaBaru);
  document.documentElement.style.setProperty('--topbar-bg', warnaBaru);
  document.documentElement.style.setProperty('--footer-bg', warnaBaru);
}

let warnaLatarLoginSaatIni = null;
function animasikanWarnaLatarLogin(){
  let warnaBaru;
  do { warnaBaru = PALET_WARNA_LATAR_ACAK[Math.floor(Math.random() * PALET_WARNA_LATAR_ACAK.length)]; }
  while (warnaBaru === warnaLatarLoginSaatIni && PALET_WARNA_LATAR_ACAK.length > 1);
  warnaLatarLoginSaatIni = warnaBaru;
  // Diset di :root (lewat CSS variable --login-bg), BUKAN inline style langsung
  // ke .login-wrap — soalnya render() mengganti ulang seluruh innerHTML tiap kali
  // (termasuk elemen .login-wrap), jadi inline style langsung akan ikut hilang.
  // CSS variable di :root tidak ikut hilang walau innerHTML di dalamnya diganti.
  document.documentElement.style.setProperty('--login-bg', warnaBaru);
}
// Cek semua kemungkinan flag "sedang loading" yang dipakai di layar-layar login/gerbang/wizard
function apakahMasihMemprosesLogin(){
  return !!(state.loading || state.emailLookupLoading || (state.setupWizard && state.setupWizard.loading));
}
let intervalWarnaLatar = null;
function mulaiAnimasiWarnaLatar(){
  animasikanWarnaLatarLogin(); // ganti warna langsung begitu diklik
  if (intervalWarnaLatar) return; // sudah ada siklus berjalan, jangan dobel
  intervalWarnaLatar = setInterval(() => {
    if (apakahMasihMemprosesLogin()){
      animasikanWarnaLatarLogin(); // masih proses -> lanjut ke warna berikutnya
    } else {
      clearInterval(intervalWarnaLatar); // sudah selesai (berhasil/gagal/pindah layar) -> berhenti
      intervalWarnaLatar = null;
    }
  }, 2200); // sedikit lebih lama dari durasi transisi CSS (2s) supaya tiap transisi sempat selesai mulus dulu
}

// Timer detik di samping ikon koin — supaya kelihatan persis berapa lama tiap
// proses (cek email, login, dst) benar-benar makan waktu. Update tiap 100ms
// langsung ke elemen DOM (bukan lewat render()), supaya angkanya jalan mulus
// walau render() sendiri jarang dipanggil selama menunggu network.
let waktuMulaiLoading = null;
let intervalTimerLoading = null;
function mulaiTimerLoading(){
  waktuMulaiLoading = Date.now();
  if (intervalTimerLoading) return;
  intervalTimerLoading = setInterval(() => {
    const el = document.getElementById('loading-timer-detik');
    if (apakahMasihMemprosesLogin()){
      if (el) el.textContent = ((Date.now() - waktuMulaiLoading) / 1000).toFixed(1) + 's';
    } else {
      clearInterval(intervalTimerLoading);
      intervalTimerLoading = null;
    }
  }, 100);
}
document.addEventListener('click', function(ev){
  if (ev.target.closest('.login-box .primary')) { mulaiAnimasiWarnaLatar(); mulaiTimerLoading(); }
});

render(); // tampilkan layar "Memuat..." dulu
mulaiAplikasi();
</script>
