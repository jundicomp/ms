<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F6F1; --surface:#FFFFFF; --ink:#1A1D23; --ink-soft:#5B5E68;
    --navy:#16233F; --navy-2:#202F52; --gold:#B8862B; --gold-soft:#F1E4C8;
    --border:#E4E1D4; --danger:#A23B2E; --sage:#52795C; --slate:#3D5A6C;
    --login-bg: var(--navy);
    --font-display:'Source Serif 4',Georgia,serif; --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--ink);}
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .body-row{display:flex;flex:1;min-height:0;}

  .seal{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;position:relative;font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--gold);flex-shrink:0;}
  .seal::before{content:'';position:absolute;inset:4px;border:1px dashed var(--gold);border-radius:50%;opacity:.55;}

  /* ---- LOGIN ---- */
  .login-wrap{flex:1;display:flex;align-items:center;justify-content:center;background:var(--login-bg);min-height:100vh;transition:background-color 2s ease;}
  .login-box{width:380px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:32px;}
  .login-box .seal{margin:0 auto 14px;}
  .login-title{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--navy);text-align:center;margin:0 0 4px;}
  .login-sub{font-size:12.5px;color:var(--ink-soft);text-align:center;margin:0 0 22px;}
  label{font-size:12px;color:var(--ink-soft);display:block;margin:0 0 5px;}
  input{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-size:13.5px;margin-bottom:14px;font-family:var(--font-body);}
  input:focus{outline:none;border-color:var(--gold);}
  button.primary{width:100%;padding:10px;border:none;border-radius:7px;background:var(--navy);color:#fff;font-size:13.5px;font-weight:500;cursor:pointer;}
  button.primary:hover{background:var(--navy-2);}
  .btn-secondary{padding:8px 14px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--navy);font-size:12.5px;font-weight:500;cursor:pointer;font-family:var(--font-body);display:inline-flex;align-items:center;}
  .btn-secondary:hover{background:var(--gold-soft);border-color:var(--gold);}
  .error-msg{background:#F3E1DC;color:var(--danger);font-size:12.5px;padding:8px 11px;border-radius:7px;margin-bottom:14px;}
  .demo-accounts{margin-top:18px;border-top:1px solid var(--border);padding-top:14px;}
  .demo-accounts summary{font-size:11.5px;color:var(--ink-soft);cursor:pointer;}
  .demo-row{display:flex;justify-content:space-between;font-size:11.5px;font-family:var(--font-mono);color:var(--ink-soft);padding:4px 0;cursor:pointer;}
  .demo-row:hover{color:var(--navy);}

  /* ---- SHELL ---- */
  #sidebar{width:250px;background:var(--sidebar-bg, var(--navy));color:#EDEEF2;flex-shrink:0;display:flex;flex-direction:column;padding:20px 14px;transition:width .2s ease, padding .2s ease, background-color 1s ease;overflow:hidden;}
  #sidebar.collapsed{width:0;padding:0;border:none;}
  .hamburger-btn{width:38px;height:38px;border-radius:8px;background:var(--navy);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
  .hamburger-btn:hover{background:var(--navy-2);}
  .content-topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .sidebar-backdrop{display:none;}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 20px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:16px;}
  .brand .seal{width:36px;height:36px;font-size:13px;}
  .brand-name{font-family:var(--font-display);font-size:15px;font-weight:600;}
  .brand-sub{font-size:10px;color:#9AA4BB;font-family:var(--font-mono);}
  .role-badge{display:flex;align-items:center;gap:10px;padding:10px;margin-bottom:18px;background:rgba(255,255,255,.05);border-radius:8px;border:1px solid rgba(255,255,255,.08);}
  .role-badge .seal{width:30px;height:30px;font-size:11px;}
  .role-badge .name{font-size:13px;font-weight:500;}
  .role-badge .label{font-size:11px;color:#9AA4BB;}
  .nav-section-title{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#7D879E;padding:10px 10px 6px;font-weight:600;}
  .sidebar-footer{margin-top:auto;padding:14px 10px 4px;font-size:10.5px;color:#7D879E;border-top:1px solid rgba(255,255,255,.08);text-align:center;white-space:nowrap;}
  nav{flex:1;overflow-y:auto;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;cursor:pointer;font-size:13.5px;color:#D2D6E0;margin-bottom:2px;}
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-item.active{background:var(--gold);color:#2B1E08;font-weight:500;}
  .nav-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;}
  .nav-icon{display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:.85;}
  .nav-item.active .nav-icon{opacity:1;}
  .logout-btn{margin-top:12px;padding:9px;text-align:center;font-size:12.5px;color:#D2D6E0;border:1px solid rgba(255,255,255,.15);border-radius:7px;cursor:pointer;}
  .logout-btn:hover{background:rgba(255,255,255,.06);}

  main{flex:1;padding:32px 40px;max-width:1080px;}
  .page-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px;}
  h1{font-family:var(--font-display);font-size:26px;font-weight:600;margin:0 0 4px;color:var(--navy);}
  .page-sub{font-size:13px;color:var(--ink-soft);margin:0;}
  .stamp-tag{font-family:var(--font-mono);font-size:10.5px;color:var(--gold);border:1px solid var(--gold);padding:3px 9px;border-radius:20px;background:var(--gold-soft);}

  .grid{display:grid;gap:16px;margin-bottom:24px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;}
  .stat-label{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .stat-value{font-family:var(--font-display);font-size:26px;font-weight:600;color:var(--navy);}
  .stat-delta{font-size:12px;color:var(--sage);margin-top:4px;}
  .stat-delta.down{color:var(--danger);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--border);padding:8px 10px;font-weight:600;}
  td{padding:10px 10px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  .badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500;}
  .badge.ok{background:#E5EFE3;color:var(--sage);}
  .badge.warn{background:var(--gold-soft);color:var(--gold);}
  .badge.due{background:#F3E1DC;color:var(--danger);}
  .badge.pending{background:#E7EAF2;color:var(--slate);}
  .section-title{font-size:15px;font-weight:600;margin:0 0 12px;color:var(--navy);font-family:var(--font-display);}

  .matrix-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;overflow-x:auto;}
  table.matrix{border-collapse:collapse;width:100%;font-size:12.5px;}
  .matrix th{padding:10px 8px;border-bottom:1.5px solid var(--navy);text-align:center;font-size:11px;}
  .matrix th:first-child{text-align:left;}
  .matrix td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--border);}
  .matrix td:first-child{text-align:left;font-weight:500;}
  .mod-desc{font-size:10.5px;color:var(--ink-soft);font-weight:400;display:block;}
  .toggle{width:34px;height:19px;border-radius:20px;background:#D9D5C6;position:relative;cursor:pointer;display:inline-block;border:none;padding:0;}
  .toggle::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform .15s;}
  .toggle.on{background:var(--gold);}
  .toggle.on::after{transform:translateX(15px);}
  .toggle.locked{background:var(--navy-2);opacity:.55;cursor:not-allowed;}
  .toggle.locked::after{transform:translateX(15px);}
  .na{color:#C7C3B5;font-family:var(--font-mono);font-size:11px;}
  .legend{display:flex;gap:18px;margin-top:14px;font-size:11.5px;color:var(--ink-soft);flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend .dot{width:9px;height:9px;border-radius:50%;}
  .empty{padding:40px 20px;text-align:center;color:var(--ink-soft);font-size:13px;background:var(--surface);border:1px dashed var(--border);border-radius:10px;}

  .block-today-badge-static{ font-family:var(--font-mono); font-size:10px; color:#7A5A0E; background:#FFE8A3; padding:2px 9px; border-radius:20px; font-weight:600; }

  .tabs-row{display:flex;gap:4px;margin-bottom:18px;background:var(--navy);border-radius:9px;padding:5px;flex-wrap:wrap;}
  .tab-btn{padding:9px 18px;font-size:13.5px;font-weight:500;color:#FFD966;cursor:pointer;border:none;background:none;border-radius:6px;font-family:var(--font-body);}
  .tab-btn:hover{background:rgba(255,255,255,.12);}
  .tab-btn.active{background:#FFD966;color:var(--navy);font-weight:700;}
  .filter-pill{padding:7px 16px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:12.5px;font-weight:500;color:var(--ink-soft);cursor:pointer;font-family:var(--font-body);}
  .filter-pill:hover{border-color:var(--gold);}
  .filter-pill.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .client-search-row{padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border);}
  .client-search-row:last-child{border-bottom:none;}
  .client-search-row:hover{background:var(--gold-soft);}
  .client-search-row.active{background:var(--navy);color:#fff;}
  .client-search-row.active span{color:#D9D5C6;}

  .doc-modal-backdrop{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(22,35,63,.6);display:flex;align-items:flex-start;justify-content:center;z-index:1000;padding:40px 20px;overflow-y:auto;}
  .doc-modal-box{background:#fff;border-radius:12px;max-width:680px;width:100%;padding:26px;position:relative;}
  .doc-modal-close{position:absolute;top:14px;right:16px;cursor:pointer;font-size:22px;line-height:1;color:var(--ink-soft);background:none;border:none;padding:4px;}
  .doc-modal-close:hover{color:var(--danger);}
  .a5-width-box{ max-width:793px; background:#FFFCEC; border:1px dashed #E3CE7A; border-radius:8px; padding:16px 18px; margin-bottom:16px; }
  .a5-width-box .a5-label{ font-size:10.5px; color:#9C8636; font-family:var(--font-mono); margin-bottom:10px; }

  /* ===== TOPBAR ===== */
  .topbar{display:flex;align-items:center;gap:14px;background:var(--topbar-bg, var(--navy));border-bottom:3px solid var(--gold);padding:0 18px;height:58px;flex-shrink:0;position:sticky;top:0;z-index:900;transition:background-color 1s ease;}
  .topbar-online-list{display:flex;align-items:center;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;}
  .topbar-online-list::-webkit-scrollbar{display:none;}
  .topbar-online-chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border-radius:20px;padding:4px 12px 4px 4px;flex-shrink:0;cursor:pointer;transition:background .15s;}
  .topbar-online-chip:hover{background:rgba(255,255,255,.18);}
  .topbar-online-chip .avatar-sm{width:24px;height:24px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;position:relative;flex-shrink:0;}
  .topbar-online-chip .dot{position:absolute;bottom:-1px;right:-1px;width:8px;height:8px;border-radius:50%;background:#2ED573;border:1.5px solid var(--navy);}
  .topbar-online-chip .nm{color:#EDEEF2;font-size:12px;font-weight:500;white-space:nowrap;}
  .topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .topbar-quote-wrap{ flex:1; overflow:hidden; position:relative; height:100%; display:flex; align-items:center; margin:0 14px; min-width:0; }
  #topbar-kutipan-text{
    white-space:nowrap; display:inline-block; position:relative;
    animation-name: geserKutipan; animation-timing-function:linear; animation-iteration-count:1; animation-fill-mode:forwards;
    color:#FDF6E3; font-family:var(--font-display); font-style:italic; font-weight:500; font-size:13.5px; letter-spacing:.2px;
    text-shadow:0 0 10px rgba(184,134,43,.35);
  }
  @keyframes geserKutipan{
    from { transform: translateX(100vw); }
    to   { transform: translateX(-100%); }
  }
  @media (max-width:768px){
    .topbar{ flex-wrap:wrap; height:auto; min-height:58px; padding:8px 14px; row-gap:2px; }
    .topbar-quote-wrap{ flex-basis:100%; order:10; margin:0; height:20px; }
    .topbar-right{ margin-left:auto; gap:8px; }
    .timer-countdown-idle{ display:none; } /* "alarm" idle disembunyikan di mobile, cukup jam durasi sesi saja */
    .topbar-session-timers{ margin-right:2px; font-size:10.5px; gap:0; }
    .topbar-user-name{ display:none; } /* mobile cukup ikon profil saja, tanpa nama */
    .topbar-user-btn{ padding:4px; gap:0; }
  }
  .topbar-icon-btn{position:relative;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:17px;flex-shrink:0;border:none;transition:background .15s;}
  .topbar-icon-btn:hover{background:rgba(255,255,255,.18);}
  .topbar-badge{position:absolute;top:-3px;right:-3px;background:var(--danger);color:#ffffff;font-size:10px;font-weight:700;border-radius:10px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px;line-height:1;}
  .topbar-session-timers{display:flex;gap:14px;align-items:center;font-family:var(--font-mono);font-size:11.5px;color:rgba(255,255,255,.65);margin-right:6px;}
  .topbar-user-btn{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 10px 4px 4px;border-radius:20px;transition:background .15s;}
  .topbar-user-btn:hover{background:rgba(255,255,255,.1);}
  .topbar-user-btn .seal{width:30px;height:30px;font-size:11px;border-color:var(--gold);flex-shrink:0;}
  .topbar-user-name{color:#fff;font-size:12.5px;font-weight:500;white-space:nowrap;}
  .topbar-dropdown{position:absolute;top:52px;right:18px;background:#fff;border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.2);min-width:190px;z-index:950;overflow:hidden;}
  .topbar-dropdown-item{padding:11px 16px;font-size:13px;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:8px;}
  .topbar-dropdown-item:hover{background:var(--bg);}
  .topbar-notif-dropdown{position:absolute;top:52px;right:64px;background:#fff;border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.2);min-width:270px;max-width:320px;z-index:950;padding:6px 0;}
  .topbar-notif-title{padding:8px 16px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);font-weight:600;}
  .topbar-notif-item{padding:9px 16px;font-size:12.5px;color:var(--ink);border-top:1px solid var(--border);cursor:pointer;}
  .topbar-notif-item:hover{background:var(--bg);}
  .topbar-notif-empty{padding:14px 16px;font-size:12.5px;color:var(--ink-soft);}

  .chat-popup-backdrop{position:fixed;inset:0;z-index:1400;}
  .chat-popup-panel{position:fixed;bottom:20px;right:20px;width:320px;max-height:440px;background:#fff;border-radius:14px;box-shadow:0 14px 36px rgba(0,0,0,.25);z-index:1500;display:flex;flex-direction:column;overflow:hidden;}
  .chat-popup-header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--gold);}
  .chat-popup-body{padding:12px 14px;overflow-y:auto;flex:1;}
  .chat-list-row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:10px;cursor:pointer;transition:background .12s;}
  .chat-list-row:hover{background:var(--bg);}
  .chat-unread-badge{background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;min-width:18px;height:18px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;flex-shrink:0;}
  .chat-popup-close{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;line-height:1;}

  .agenda-day-row{ display:flex; border-radius:10px; overflow:hidden; margin-bottom:14px; border:1px solid var(--border); }
  .agenda-day-number-box{ background:var(--navy); width:88px; flex-shrink:0; display:flex; align-items:center; justify-content:center; padding:14px 0; }
  .agenda-day-number{ font-family:var(--font-display); font-size:40px; font-weight:700; color:var(--gold); line-height:1; }
  .agenda-day-content{ background:var(--gold-soft); flex:1; padding:14px 18px; min-width:0; }
  .back-to-calendar-link{ display:inline-flex; align-items:center; font-family:var(--font-body); font-size:11.5px; font-weight:500; color:var(--gold); background:var(--gold-soft); border:1px solid var(--gold); padding:4px 11px; border-radius:20px; cursor:pointer; white-space:nowrap; }
  .back-to-calendar-link:hover{ background:var(--gold); color:#fff; }
  .mobile-footer{display:none;}

  .user-bubble{
    display:inline-flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--border);
    border-radius:30px; padding:7px 18px 7px 7px; cursor:pointer;
    box-shadow:0 2px 6px rgba(22,35,63,0.08); transition: transform .15s ease, box-shadow .15s ease;
  }
  .user-bubble:hover{ transform:translateY(-3px); box-shadow:0 8px 18px rgba(22,35,63,0.14); border-color:var(--gold); }
  th.sortable{cursor:pointer;user-select:none;}
  th.sortable:hover{color:var(--navy);}

  .table-navy-head th{background:var(--navy);color:#FFD966;font-size:11px;padding:11px 10px;text-align:center;font-weight:700;}
  .table-navy-head th.sortable:hover{color:#FFF3C4;}
  .jobs-table td{text-align:left;}
  .jobs-table td.nowrap-cell, .jobs-table th.nowrap-cell{white-space:nowrap;}

  .status-count-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
  .status-count-card{border:1px solid var(--border);border-radius:10px;padding:16px 20px;flex:1;min-width:150px;text-align:center;}
  .status-count-value{font-family:var(--font-display);font-size:34px;font-weight:600;line-height:1;}
  .status-count-label{font-size:12px;margin-top:8px;font-weight:500;}

  @keyframes blinkOpacity{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  @keyframes loncatKoin{
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-16px) rotate(180deg); }
  }
  .koin-loading{ font-size:34px; display:inline-block; animation:loncatKoin .6s ease-in-out infinite; margin-bottom:10px; }
  .koin-loading-kecil{ font-size:15px; display:inline-block; animation:loncatKoin .5s ease-in-out infinite; margin-right:7px; vertical-align:middle; }

  .progress-bar-track{ width:230px; height:7px; background:rgba(255,255,255,.25); border-radius:10px; overflow:hidden; margin:0 auto 12px; }
  .progress-bar-track.terang{ background:#E4E1D4; }
  .progress-bar-fill{ height:100%; background:linear-gradient(90deg,#B8862B,#F1C86B); border-radius:10px; width:0%; transition:width .25s ease; }

const REMINDER_TODAY = new Date(new Date().setHours(0,0,0,0));

function isReminderMarkedDoneInWindow(r, start, end){
  if (!r.selesaiTanggal) return false;
  const selesai = new Date(r.selesaiTanggal + 'T00:00:00');
  return selesai >= start && selesai <= end;
}
function isReminderActiveOn(r, today){
  const lama = Number(r.lamaReminderHari) || 0;
  if (!r.tanggalValue) return false;
  if (r.tanggalMode === 'Bulan Ini Saja'){
    const start = new Date(r.tanggalValue + 'T00:00:00');
    const end = new Date(start); end.setDate(end.getDate() + lama);
    if (!(today >= start && today <= end)) return false;
    return !isReminderMarkedDoneInWindow(r, start, end);
  }
  // 'Setiap Tanggal Ini' — cek kemunculan bulan berjalan & bulan sebelumnya
  // (supaya rentang yang melewati akhir bulan tetap terdeteksi aktif)
  const day = Number(r.tanggalValue);
  if (!day) return false;
  for (const monthOffset of [0, -1]){
    const start = new Date(today.getFullYear(), today.getMonth() + monthOffset, day);
    const end = new Date(start); end.setDate(end.getDate() + lama);
    if (today >= start && today <= end){
      return !isReminderMarkedDoneInWindow(r, start, end);
    }
  }
  return false;
}

function playNotifSound(freq){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq || 880;
    gain.gain.setValueAtTime(0.16, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.4);
  } catch(e){ /* audio diblokir/tidak didukung browser — abaikan secara diam-diam */ }
}

// URL Web App backend aplikasi utama (Tahap 1: Login + Users) — sungguhan, bukan simulasi lagi
// URL Web App backend aplikasi utama — SEKARANG dibaca dari parameter link
// (?backend=...), BUKAN ditanam tetap di kode. Ini membuat 1 file HTML ini
// bisa dipakai BERSAMA oleh semua pembeli — tiap pembeli dapat link unik
// berisi backend URL milik mereka sendiri, tanpa perlu edit file apa pun.
function ambilBackendURLDariLink(){
  const params = new URLSearchParams(window.location.search);
  const dariLink = params.get('backend');
  if (dariLink){
    // Simpan ke browser (localStorage) supaya kunjungan BERIKUTNYA ke URL polos
    // (tanpa ?backend=... lagi) tetap otomatis terhubung — link hanya perlu
    // diisi/diklik SEKALI saat setup pertama kali per browser/device.
    try { localStorage.setItem('pkp_backend_url', dariLink); } catch(e){}
    // Bersihkan ?backend=... dari address bar setelah disimpan — sudah tidak
    // perlu nampol di URL/riwayat browser karena sudah aman tersimpan lokal.
    try { window.history.replaceState({}, '', window.location.pathname); } catch(e){}
    return dariLink;
  }
  try { return localStorage.getItem('pkp_backend_url') || ''; } catch(e){ return ''; }
}
let WEBAPP_URL_UTAMA = ambilBackendURLDariLink();

async function callBackendUtama(action, payload){
  payload = payload || {};
  const res = await fetch(WEBAPP_URL_UTAMA, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // hindari preflight CORS
    body: JSON.stringify({ action, ...payload }),
  });
  return JSON.parse(await res.text());
}
// Ubah timestamp "terakhirAktif" (ISO string dari Sheet) jadi jumlah menit yang lalu,
// supaya kompatibel dengan seluruh kode lama yang sudah pakai field lastActiveMinutes
function hitungMenitSejakAktif(terakhirAktif){
  if (!terakhirAktif) return 99999; // belum pernah login sama sekali
  const lalu = new Date(terakhirAktif);
  if (isNaN(lalu.getTime())) return 99999;
  return Math.max(0, Math.round((Date.now() - lalu.getTime()) / 60000));
}

// Muat SEMUA data modul ke memori — dipanggil setelah login sungguhan
// MAUPUN saat memulihkan sesi dari sessionStorage (refresh halaman).
async function muatSemuaDataAplikasi(email){
  // PARALEL (bukan satu-satu berurutan) — tiap panggilan ke Apps Script makan
  // waktu ~1-2.5 detik sendiri-sendiri. Kalau dipanggil berurutan (await demi
  // await), 9 panggilan bisa menumpuk jadi 20+ detik total. Dengan paralel,
  // totalnya cuma setara 1 panggilan PALING LAMBAT, bukan jumlah semuanya.
  // Promise.allSettled dipakai (bukan Promise.all) supaya kalau salah satu
  // gagal, yang lain tetap lanjut selesai — sama seperti try/catch terpisah
  // yang dipakai sebelumnya per pemanggilan.
  await Promise.allSettled([
    muatUlangDaftarUser(email),
    muatUlangDaftarKlien(),
    muatUlangDaftarPekerjaan(),
    muatUlangDaftarReminder(),
    muatUlangDaftarInvoice(),
    muatUlangDaftarDokumen(),
    muatUlangCatatanKalender(),
    muatUlangPesan(),
    muatUlangLogAktivitas(),
  ]);
}

const api = {
  async login(email, password){
    try {
      const data = await callBackendUtama('login', { email, password });
      if (!data.success) return { success:false, message: data.message || 'Login gagal.' };

      // muat seluruh daftar user & klien ke memori — modul lain masih baca MOCK_USERS/MOCK_CLIENTS langsung
      await muatSemuaDataAplikasi(data.user.email);

      return { success:true, user: data.user, modules: this._modulesForRole(data.user.role) };
    } catch (err) {
      return { success:false, message: 'Gagal terhubung ke server: ' + err.message };
    }
  },

  async getAllModules(){
    try {
      const data = await callBackendUtama('getAllModulesMatrix');
      if (data.success && data.modules.length){
        // perbarui moduleConfig di memori supaya konsisten dengan Sheet
        data.modules.forEach(m => {
          if (!moduleConfig[m.id]) moduleConfig[m.id] = {};
          ROLES.forEach(r => { moduleConfig[m.id][r.id] = !!m[r.id]; });
        });
      }
    } catch (err) { /* kalau gagal, pakai default statis (MODULE_DEFS) sebagai cadangan */ }

    const rows = MODULE_DEFS.map(m=>{
      const row = { id:m.id, name:m.name, desc:m.desc, core:m.core };
      ROLES.forEach(r=>{ row[r.id] = moduleConfig[m.id][r.id]; });
      return row;
    });
    return { success:true, modules: rows };
  },

  async toggleModule(moduleId, role){
    const def = MODULE_DEFS.find(m=>m.id===moduleId);
    if (def.core) return { success:false, message:'Modul inti tidak dapat dinonaktifkan' };
    try {
      const data = await callBackendUtama('toggleModuleAccess', { moduleId, role });
      if (!data.success) return { success:false, message: data.message || 'Gagal menyimpan.' };
      moduleConfig[moduleId][role] = data.newValue;
      return { success:true, newValue: data.newValue };
    } catch (err) {
      return { success:false, message: 'Gagal terhubung ke server: ' + err.message };
    }
  },

  _modulesForRole(roleId){
    return MODULE_DEFS.filter(m => moduleConfig[m.id][roleId])
      .map(m => ({ id:m.id, name:m.name }));
  },
};

// CAPTCHA sederhana (soal matematika) — mencegah bot/script sederhana submit berkali-kali.
// Bukan pengganti reCAPTCHA sungguhan, tapi cukup untuk mencegah percobaan otomatis kasar.
function pastikanCaptcha(key){
  if (!state[key]){
    state[key] = { a: Math.floor(Math.random()*8)+1, b: Math.floor(Math.random()*8)+1 };
  }
  return state[key];
}
function buatUlangCaptcha(key){
  state[key] = { a: Math.floor(Math.random()*8)+1, b: Math.floor(Math.random()*8)+1 };
}

async function handleLoginSubmit(ev){
  ev.preventDefault();
  const email = document.getElementById('f-email').value.trim();
  const password = document.getElementById('f-password').value;
  const jawabanCaptcha = Number(document.getElementById('f-captcha').value);
  const soal = state.captchaLogin;

  if (jawabanCaptcha !== soal.a + soal.b){
    state.error = 'Jawaban soal keamanan salah, coba lagi.';
    buatUlangCaptcha('captchaLogin');
    render();
    return;
  }

  state.error = ''; state.loading = true; render();
  const result = await api.login(email, password);
  if (result.success){
    state.session = result.user;
    state.modules = result.modules;
    state.activeModule = result.modules[0] ? result.modules[0].id : null;
    logActivity('Login', `${result.user.nama} masuk ke sistem`);
    try { sessionStorage.setItem('portalSession', JSON.stringify(result.user)); } catch(e){ /* kalau browser blokir storage, tidak masalah — login tetap jalan normal */ }
    mulaiPengawasanIdle();
    mulaiTimerTopbar();
    tampilkanKutipanBaru();
  } else {
    state.error = result.message;
    buatUlangCaptcha('captchaLogin');
  }
  state.loading = false; render();
}

let kutipanIndexTerakhir = -1;
let kutipanAktifSaatIni = KUTIPAN_MOTIVASI[0];
let kutipanDurasiSaatIni = 14;
let waktuKutipanMulai = Date.now();
function tampilkanKutipanBaru(){
  let idx;
  do { idx = Math.floor(Math.random() * KUTIPAN_MOTIVASI.length); }
  while (idx === kutipanIndexTerakhir && KUTIPAN_MOTIVASI.length > 1);
  kutipanIndexTerakhir = idx;
  kutipanAktifSaatIni = KUTIPAN_MOTIVASI[idx];
  kutipanDurasiSaatIni = Math.max(20, kutipanAktifSaatIni.length * 0.26); // kecepatan diturunkan setengahnya (durasi 2x lipat)
  waktuKutipanMulai = Date.now();
  const el = document.getElementById('topbar-kutipan-text');
  if (el){
    el.textContent = kutipanAktifSaatIni;
    el.style.animation = 'none';
    void el.offsetWidth; // paksa reflow supaya animasi benar-benar restart dari awal
    el.style.animation = `geserKutipan ${kutipanDurasiSaatIni}s linear forwards`;
  }
}
// Begitu 1 kutipan selesai bergeser penuh, otomatis ganti ke kutipan random berikutnya
document.addEventListener('animationend', function(ev){
  if (ev.target && ev.target.id === 'topbar-kutipan-text') tampilkanKutipanBaru();
});

function mulaiPengawasanIdle(){
  clearTimeout(_idleTimer);
  if (!state.session) return; // cuma aktif kalau sedang login
  waktuIdleTerakhirReset = Date.now();
  const menit = Number(state.systemSettings.waktuTimeoutMenit) || 15;
  _idleTimer = setTimeout(() => { tampilkanDialogIdle(); }, menit * 60 * 1000);
}
// Timer di topbar (durasi sesi + hitung mundur idle) — update tiap detik,
// langsung ke elemen DOM (bukan lewat render()) supaya jalan mulus dan tidak
// perlu render ulang seluruh halaman tiap detik.
function formatDurasiSesi(detik){
  const j = Math.floor(detik/3600), m = Math.floor((detik%3600)/60), d = detik%60;
  return String(j).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(d).padStart(2,'0');
}
function mulaiTimerTopbar(){
  waktuLoginBerhasil = Date.now();
  clearInterval(_topbarTimerInterval);
  _topbarTimerInterval = setInterval(() => {
    if (!state.session){ clearInterval(_topbarTimerInterval); return; }
    const elDurasi = document.getElementById('topbar-durasi-sesi');
    if (elDurasi) elDurasi.textContent = formatDurasiSesi(Math.floor((Date.now()-waktuLoginBerhasil)/1000));

    const elIdle = document.getElementById('topbar-countdown-idle');
    if (elIdle){
      if (state.dialogIdleTampil){
        elIdle.textContent = '00:00';
      } else {
        const menit = Number(state.systemSettings.waktuTimeoutMenit) || 15;
        const sisaDetik = Math.max(0, (menit*60) - Math.floor((Date.now()-waktuIdleTerakhirReset)/1000));
        elIdle.textContent = String(Math.floor(sisaDetik/60)).padStart(2,'0')+':'+String(sisaDetik%60).padStart(2,'0');
      }
    }
  }, 1000);
}
function resetIdleTimer(){
  if (state.session && !state.dialogIdleTampil) mulaiPengawasanIdle();
}
function tampilkanDialogIdle(){
  state.dialogIdleTampil = true;
  _idleCountdownSisa = 15;
  render();
  clearInterval(_idleCountdownInterval);
  _idleCountdownInterval = setInterval(() => {
    _idleCountdownSisa--;
    const el = document.getElementById('idle-countdown-angka');
    if (el) el.textContent = _idleCountdownSisa;
    if (_idleCountdownSisa <= 0){
      clearInterval(_idleCountdownInterval);
      konfirmasiLogoutIdle();
    }
  }, 1000);
}
function batalkanLogoutIdle(){
  clearInterval(_idleCountdownInterval);
  state.dialogIdleTampil = false;
  render();
  mulaiPengawasanIdle(); // hitung mundur idle mulai dari awal lagi
}
function konfirmasiLogoutIdle(){
  clearInterval(_idleCountdownInterval);
  state.dialogIdleTampil = false;
  handleLogout();
}
function renderDialogIdle(){
  return `<div class="modal-backdrop" style="z-index:99999;">
    <div class="modal-box" style="max-width:380px;text-align:center;">
      <div style="font-size:38px;margin-bottom:10px;">⏰</div>
      <h3 style="margin-bottom:10px;">Sesi Akan Berakhir</h3>
      <p style="font-size:13.5px;color:var(--ink-soft);line-height:1.6;">Karena tidak ada aktivitas, Anda akan otomatis logout dalam <b id="idle-countdown-angka" style="color:var(--danger);font-size:16px;">${_idleCountdownSisa}</b> detik.</p>
      <div style="display:flex;gap:10px;margin-top:20px;">
        <button type="button" onclick="batalkanLogoutIdle()" style="flex:1;padding:11px;border:1px solid var(--border);border-radius:7px;background:#fff;font-size:13px;cursor:pointer;font-weight:600;">Batal, Tetap Login</button>
        <button type="button" onclick="konfirmasiLogoutIdle()" class="primary" style="flex:1;width:auto;">Logout Sekarang</button>
      </div>
    </div>
  </div>`;
}
// Pantau aktivitas pengguna secara global — apa pun interaksinya, reset hitungan idle
['mousemove','keydown','click','scroll','touchstart'].forEach(evt => {
  document.addEventListener(evt, resetIdleTimer, { passive: true });
});

function handleLogout(){
  if (state.session) logActivity('Logout', `${state.session.nama} keluar dari sistem`);
  state.session=null; state.modules=[]; state.activeModule=null; state.allModulesMatrix=null;
  state.lastNotifCount=null; state.chatView={ activeWith:null }; state.chatPopupOpen=false;
  state.gatePage='email'; state.emailGerbang='';
  try { sessionStorage.removeItem('portalSession'); } catch(e){}
  clearTimeout(_idleTimer);
  clearInterval(_idleCountdownInterval);
  clearInterval(_topbarTimerInterval);
  hentikanPollingChat();
  render();
}

   ================================================================ */
function openUserForm(mode, email){
  state.userForm.open = true;
  state.userForm.mode = mode;
  state.userForm.originalEmail = email || null;
  const existing = email ? MOCK_USERS.find(u=>u.email===email) : null;
  state.userForm.foto = existing ? existing.foto : null;
  render();
  if (existing){
    document.getElementById('uf-nama').value = existing.nama;
    document.getElementById('uf-email').value = existing.email;
    document.getElementById('uf-role').value = existing.role;
    document.getElementById('uf-status').value = existing.status;
  }
}
function closeUserForm(){
  state.userForm.open = false; state.userForm.foto = null; render();
}
function handlePhotoChange(input){
  const file = input.files && input.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')){ alert('File harus berupa gambar'); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    state.userForm.foto = e.target.result;
    const preview = document.getElementById('uf-photo-preview');
    if (preview) preview.innerHTML = `<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
  };
  reader.readAsDataURL(file);
}
let sedangMenyimpanUser = false;
async function handleUserFormSubmit(ev){
  ev.preventDefault();
  if (sedangMenyimpanUser) return;
  const nama = document.getElementById('uf-nama').value.trim();
  const email = document.getElementById('uf-email').value.trim().toLowerCase();
  const role = document.getElementById('uf-role').value;
  const status = document.getElementById('uf-status').value;
  const password = document.getElementById('uf-password').value;

  if (!nama || !email || !role){ alert('Nama, email, dan role wajib diisi.'); return; }
  if (state.userForm.mode === 'add' && !password){ alert('Password wajib diisi untuk user baru.'); return; }

  sedangMenyimpanUser = true;
  tampilkanProgress('Menyimpan data user...');
  try {
    let data;
    if (state.userForm.mode === 'add'){
      data = await callBackendUtama('addUser', { user: { nama, email, role, status, password, fotoURL: state.userForm.foto || '', whatsapp: '' } });
    } else {
      data = await callBackendUtama('updateUser', { user: { email: state.userForm.originalEmail, nama, role, status, password: password || undefined, fotoURL: state.userForm.foto || '' } });
    }
    if (!data.success) throw new Error(data.message || 'Gagal menyimpan.');

    logActivity(state.userForm.mode === 'add' ? 'Tambah User' : 'Ubah User', `${nama} (${email})`);
    await muatUlangDaftarUser(state.session.email);
    closeUserForm();
  } catch (err) {
    alert('Gagal menyimpan user: ' + err.message);
  } finally {
    sedangMenyimpanUser = false;
    sembunyikanProgress();
  }
}
async function deleteUser(email){
  if (!confirm('Hapus user ini? Tindakan tidak dapat dibatalkan.')) return;
  tampilkanProgress('Menghapus data user...');
  try {
    const data = await callBackendUtama('deleteUser', { email });
    if (!data.success) throw new Error(data.message || 'Gagal menghapus.');
    logActivity('Hapus User', email);
    await muatUlangDaftarUser(state.session.email);
    render();
  } catch (err) {
    alert('Gagal menghapus user: ' + err.message);
  } finally {
    sembunyikanProgress();
  }
}

    konsultanEmail: getFieldVal('cf-konsultanEmail'), jenisLayanan, jenisKontrak: getFieldVal('cf-jenisKontrak'),

function buildClientDetailHtml(c){
  const konsultan = MOCK_USERS.find(u=>u.email===c.konsultanEmail);
  const statusColor = c.statusKlien==='Aktif' ? '#52795C' : (c.statusKlien==='Prospek' ? '#B8862B' : '#A23B2E');
  const jenisWPLabel = c.jenisWP === 'OP' ? 'Orang Pribadi' : 'Badan Usaha';
  const avatarHtml = c.foto
    ? `<img src="${c.foto}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
    : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:600;color:#B8862B;">${initials(c.nama)}</div>`;

  const row = (label, value) => (value ? `<div class="dr"><span class="dl">${label}</span><span class="dv">${value}</span></div>` : '');
  const rupiah = (n) => n ? 'Rp ' + Number(n).toLocaleString('id-ID') : '';

  const identitasRows = row('Jenis Wajib Pajak', jenisWPLabel) + row('NPWP', c.npwp) +
    (c.jenisWP==='OP' ? row('NIK', c.nik) : '') + row('NITKU', c.nitku) +

function openReminderForm(mode, id){
  state.reminderForm.open = true;
  state.reminderForm.mode = mode;
  state.reminderForm.originalId = id || null;
  render();
  const existing = id ? MOCK_REMINDERS.find(r=>r.id===id) : null;
  if (existing){
    document.getElementById('rf-jenisJadwal').value = existing.jenisJadwal;
    document.getElementById('rf-wajibPajak').value = existing.wajibPajak || 'Orang Pribadi';
    if (existing.badanUsahaSubtype) document.getElementById('rf-badanUsahaSubtype').value = existing.badanUsahaSubtype;
    document.getElementById('rf-tanggalMode').value = existing.tanggalMode;
    document.getElementById('rf-lamaReminderHari').value = existing.lamaReminderHari;
    document.getElementById('rf-clientId').value = existing.clientId;
    document.querySelectorAll('.rf-isi').forEach(cb=>{ cb.checked = existing.isiReminder.includes(Number(cb.value)); });
  }
  toggleReminderTanggalField();
  toggleReminderWajibPajakField();
}
function closeReminderForm(){ state.reminderForm.open = false; render(); }
function exportRemindersExcel(){
  const rows = MOCK_REMINDERS.map((r, idx) => {
    const client = MOCK_CLIENTS.find(c=>c.id===r.clientId);
    const tanggalLabel = r.tanggalMode === 'Bulan Ini Saja' ? formatDDMMYY(r.tanggalValue) : `Tanggal ${r.tanggalValue} setiap bulan`;
    return {
      'No': idx + 1,
      'Jenis Jadwal': r.jenisJadwal,
      'Wajib Pajak': r.wajibPajak==='Badan Usaha' ? `Badan Usaha (${r.badanUsahaSubtype||'-'})` : 'Orang Pribadi',
      'Tanggal': tanggalLabel,

      'Klien': client ? client.nama : '-',
      'Isi Reminder': r.isiReminder.map(n=>`${n}. ${REMINDER_ITEMS[n-1]}`).join('; '),
      'Status': isReminderActiveOn(r, REMINDER_TODAY) ? 'Aktif' : 'Selesai',
    };
  });
  exportRowsToExcel('Pengaturan_Reminder_Klien.xlsx', rows);
}
function toggleReminderTanggalField(){
  const mode = document.getElementById('rf-tanggalMode').value;
  document.getElementById('rf-tanggal-bulanini').style.display = mode === 'Bulan Ini Saja' ? 'block' : 'none';
  document.getElementById('rf-tanggal-setiap').style.display = mode === 'Setiap Tanggal Ini' ? 'block' : 'none';
}
function toggleReminderWajibPajakField(){
  const wp = document.getElementById('rf-wajibPajak').value;
  document.getElementById('rf-badan-subtype-wrap').style.display = wp === 'Badan Usaha' ? 'block' : 'none';

let sedangMenyimpanReminder = false;
async function handleReminderFormSubmit(ev){
  ev.preventDefault();
  if (sedangMenyimpanReminder) return;
  const jenisJadwal = document.getElementById('rf-jenisJadwal').value;
  const wajibPajak = document.getElementById('rf-wajibPajak').value;
  const badanUsahaSubtype = wajibPajak === 'Badan Usaha' ? document.getElementById('rf-badanUsahaSubtype').value : '';
  const tanggalMode = document.getElementById('rf-tanggalMode').value;
  const tanggalValue = tanggalMode === 'Bulan Ini Saja'
    ? document.getElementById('rf-tanggalBulanIni').value
    : document.getElementById('rf-tanggalSetiap').value;
  const lamaReminderHari = document.getElementById('rf-lamaReminderHari').value;
  const clientId = document.getElementById('rf-clientId').value;
  const isiReminder = Array.from(document.querySelectorAll('.rf-isi:checked')).map(cb=>Number(cb.value));

  if (!clientId){ alert('Pilih klien terlebih dahulu'); return; }
  if (!isiReminder.length){ alert('Pilih minimal satu isi reminder'); return; }

  const data = { jenisJadwal, wajibPajak, badanUsahaSubtype, tanggalMode, tanggalValue, lamaReminderHari, clientId, isiReminder };
  const clientForLog = MOCK_CLIENTS.find(c=>c.id===clientId);

  sedangMenyimpanReminder = true;
  tampilkanProgress('Menyimpan reminder...');
  try {
    let resp;
    if (state.reminderForm.mode === 'add'){
      resp = await callBackendUtama('addReminder', { reminder: data });
    } else {
      resp = await callBackendUtama('updateReminder', { id: state.reminderForm.originalId, updates: data });
    }
    if (!resp.success) throw new Error(resp.message || 'Gagal menyimpan.');

    logActivity(state.reminderForm.mode === 'add' ? 'Tambah Reminder' : 'Ubah Reminder', `Untuk klien ${clientForLog ? clientForLog.nama : clientId}`);
    await muatUlangDaftarReminder();
    closeReminderForm();
  } catch (err) {
    alert('Gagal menyimpan reminder: ' + err.message);
  } finally {
    sedangMenyimpanReminder = false;
    sembunyikanProgress();
  }
}
async function deleteReminder(id){
  if (!confirm('Hapus pengaturan reminder ini?')) return;
  tampilkanProgress('Menghapus reminder...');
  try {
    const resp = await callBackendUtama('deleteReminder', { id });
    if (!resp.success) throw new Error(resp.message || 'Gagal menghapus.');
    logActivity('Hapus Reminder', id);
    await muatUlangDaftarReminder();
    render();
  } catch (err) {
    alert('Gagal menghapus reminder: ' + err.message);
  } finally {
    sembunyikanProgress();
  }
}
async function markReminderSelesai(id){
  const r = MOCK_REMINDERS.find(x=>x.id===id);
  if (!r) return;
  const selesaiTanggal = REMINDER_TODAY.toISOString().slice(0,10);
  try {
    const resp = await callBackendUtama('updateReminder', { id, updates: { selesaiTanggal } });
    if (!resp.success) throw new Error(resp.message || 'Gagal menyimpan.');
    r.selesaiTanggal = selesaiTanggal;
    const client = MOCK_CLIENTS.find(c=>c.id===r.clientId);
    logActivity('Tandai Reminder Selesai', client ? client.nama : id);
    render();
  } catch (err) {
    alert('Gagal menandai selesai: ' + err.message);
  }
}
async function undoReminderSelesai(id){
  const r = MOCK_REMINDERS.find(x=>x.id===id);
  if (!r) return;
  try {
    const resp = await callBackendUtama('updateReminder', { id, updates: { selesaiTanggal: '' } });
    if (!resp.success) throw new Error(resp.message || 'Gagal menyimpan.');
    r.selesaiTanggal = null;
    render();
  } catch (err) {
    alert('Gagal membatalkan status selesai: ' + err.message);
  }
}

// Aturan pengelompokan: Kelompok 1 ("Tanggal 1-15") adalah bucket umum — SEMUA
// reminder yang sedang aktif akan selalu ikut muncul di sini sejak tanggal 1,
// apa pun jenis/isi reminder-nya (baik deadline tengah bulan, akhir bulan,
// maupun akhir tahun). Kelompok 2/3/4 tetap mengikuti nomor item yang dicentang
// seperti semula — jadi 1 reminder bisa tampil di lebih dari 1 kelompok sekaligus.
function reminderBelongsToBlock(r, blockIndex){
  if (blockIndex === 0) return true;
  return r.isiReminder.some(n => REMINDER_BLOCKS[blockIndex].items.includes(n));
}
// Untuk pewarnaan kartu (1 kartu = 1 warna) dipakai kategori "asli" berdasarkan
// isi reminder-nya saja (tidak ikut aturan "semua masuk Kelompok 1" di atas),
// supaya tiap kartu tetap mencerminkan kategori kewajibannya yang sesungguhnya.
function getReminderPrimaryBlockIndex(r){
  for (let i=0;i<REMINDER_BLOCKS.length;i++){
    if (r.isiReminder.some(n => REMINDER_BLOCKS[i].items.includes(n))) return i;
  }
  return null;
}

// Kelompok 1 butuh logika aktif yang beda dari Kelompok 2-4: bukan cuma aktif
// pas mendekati tanggal jatuh tempo, tapi "masih berlaku" sejak tanggal 1 bulan
// berjalan sampai hari jatuh temponya (atau sampai ditandai selesai di siklus ini).
function getReminderDeadlineDayThisMonth(r, today){
  if (r.tanggalMode === 'Setiap Tanggal Ini'){
    return Number(r.tanggalValue) || null;
  }
  if (!r.tanggalValue) return null;
  const d = new Date(r.tanggalValue + 'T00:00:00');
  if (d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth()) return d.getDate();
  return null; // jatuh temponya bukan bulan ini
}
function isReminderPendingThisMonth(r, today){
  const deadlineDay = getReminderDeadlineDayThisMonth(r, today);
  if (deadlineDay === null) return false;
  const lama = Number(r.lamaReminderHari) || 0;
  const endDay = deadlineDay + lama; // masih relevan sejak tanggal 1 s.d. jatuh tempo + masa reminder
  if (today.getDate() > endDay) return false;
  if (r.selesaiTanggal){
    const selesai = new Date(r.selesaiTanggal + 'T00:00:00');
    if (selesai.getFullYear() === today.getFullYear() && selesai.getMonth() === today.getMonth()) return false;
  }
  return true;
}

function renderReminderBlocksHtml(){
  const todayDate = REMINDER_TODAY.getDate();
  const blockStyles = [
    { color: STAT_CARD_PALETTE[0].color, bg: STAT_CARD_PALETTE[0].bg, icon: ICON_STAT_BELL },
    { color: STAT_CARD_PALETTE[1].color, bg: STAT_CARD_PALETTE[1].bg, icon: ICON_STAT_RECEIPT },
    { color: STAT_CARD_PALETTE[3].color, bg: STAT_CARD_PALETTE[3].bg, icon: ICON_STAT_USERS },
    { color: STAT_CARD_PALETTE[2].color, bg: STAT_CARD_PALETTE[2].bg, icon: ICON_STAT_BUILDING },
  ];
  const blocksHtml = REMINDER_BLOCKS.map((block, idx) => {
    const matchingClients = new Set();
    MOCK_REMINDERS.forEach(r => {
      if (reminderBelongsToBlock(r, idx) && isReminderPendingThisMonth(r, REMINDER_TODAY)){
        const c = MOCK_CLIENTS.find(cl => cl.id === r.clientId);
        if (c) matchingClients.add(c.nama);
      }
    });
    const clientNames = Array.from(matchingClients);
    const clientListHtml = clientNames.length
      ? clientNames.map(n => `<li>${n}</li>`).join('')
      : `<li style="list-style:none;color:var(--ink-soft);">Belum ada klien pada rentang ini</li>`;

    const isTodayInRange = block.rangeStart && todayDate >= block.rangeStart && todayDate <= block.rangeEnd;
    const todayBadge = isTodayInRange ? `<span class="block-today-badge-static">Hari ini</span>` : '';
    const bs = blockStyles[idx % blockStyles.length];

    return `
      <div class="card" style="background:${bs.bg};border-color:${isTodayInRange ? 'var(--gold)' : bs.bg};${isTodayInRange?'border-width:2px;':''}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;" onclick="toggleReminderBlockDetail(${idx})">

              <div style="font-family:var(--font-display);font-size:13.5px;font-weight:600;color:var(--navy);display:flex;align-items:center;flex-wrap:wrap;gap:6px;">${block.title}${todayBadge}</div>
              <div style="font-size:11.5px;color:var(--ink-soft);margin-top:4px;">${block.items.length} kewajiban &nbsp;·&nbsp; ${clientNames.length} klien</div>
            </div>
          </div>
          <span id="rb-arrow-${idx}" style="color:var(--ink-soft);font-size:13px;flex-shrink:0;">▾</span>
        </div>
        <div id="rb-detail-${idx}" style="display:none;margin-top:12px;border-top:1px solid rgba(0,0,0,.08);padding-top:12px;">
          <ul style="margin:0 0 12px;padding-left:18px;font-size:11.5px;color:var(--ink-soft);line-height:1.6;">
            ${block.items.map(n => `<li>${REMINDER_ITEMS[n-1]}</li>`).join('')}
          </ul>
          <div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);margin-bottom:6px;">Klien pada rentang ini</div>
          <ul style="margin:0;padding-left:18px;font-size:12.5px;line-height:1.7;max-height:160px;overflow-y:auto;">${clientListHtml}</ul>
        </div>
      </div>`;
  }).join('');
  return `<div class="grid grid-2">${blocksHtml}</div>`;
}

function assignableUserOptionsHtml(selected){
  return MOCK_USERS.filter(u=>u.status==='Aktif').map(u=>
    `<option value="${u.email}" ${u.email===selected?'selected':''}>${u.nama} (${roleName(u.role)})</option>`
  ).join('');
}
function clientOptionsHtml(selected){
  return `<option value="">- Tidak terkait klien tertentu -</option>` +
    MOCK_CLIENTS.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${c.nama}</option>`).join('');
}
function openJobForm(mode, id){
  state.jobForm.open = true; state.jobForm.mode = mode; state.jobForm.originalId = id || null;
  render();
  const existing = id ? MOCK_JOBS.find(j=>j.id===id) : null;
  if (existing){
    ['judul','deskripsi','klienId','ditugaskanKe','prioritas','tanggalMulai','waktuMulai','tenggatWaktu','status','approverEmail'].forEach(key=>{
      const el = document.getElementById('jf-'+key);
      if (el) el.value = existing[key];
    });
    updateJobTotalDays();
  }
}
function closeJobForm(){ state.jobForm.open = false; render(); }
function calcTotalHari(start, end){
  if (!start || !end) return null;
  const d1 = new Date(start + 'T00:00:00');
  const d2 = new Date(end + 'T00:00:00');
  const diff = Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
  return isNaN(diff) ? null : diff;
}
function updateJobTotalDays(){
  const start = document.getElementById('jf-tanggalMulai').value;
  const end = document.getElementById('jf-tenggatWaktu').value;
  const el = document.getElementById('jf-totalHari');
  if (!el) return;
  const total = calcTotalHari(start, end);
  if (total === null){ el.textContent = '-'; return; }
  el.textContent = total >= 0 ? `${total} hari` : 'Tanggal selesai lebih awal dari tanggal mulai';
}
let sedangMenyimpanJob = false;
async function handleJobFormSubmit(ev){
  ev.preventDefault();
  if (sedangMenyimpanJob) return;
  const data = {
    judul: getFieldVal('jf-judul'), deskripsi: getFieldVal('jf-deskripsi'), klienId: getFieldVal('jf-klienId'),
    ditugaskanKe: getFieldVal('jf-ditugaskanKe'), prioritas: getFieldVal('jf-prioritas'),
    approverEmail: getFieldVal('jf-approverEmail'),
    tanggalMulai: getFieldVal('jf-tanggalMulai'), waktuMulai: getFieldVal('jf-waktuMulai'), tenggatWaktu: getFieldVal('jf-tenggatWaktu'),
    status: getFieldVal('jf-status'),
  };
  if (!data.judul || !data.ditugaskanKe){ alert('Judul pekerjaan dan penerima tugas wajib diisi'); return; }

  sedangMenyimpanJob = true;
  tampilkanProgress('Menyimpan pekerjaan...');
  try {
    let resp;
    if (state.jobForm.mode === 'add'){
      resp = await callBackendUtama('addJob', { job: { ...data, dibuatOleh: state.session.email, catatanPengerjaan:'', catatanPersetujuan:'', disetujuiOleh:'', tanggalSelesai:'' } });
    } else {
      resp = await callBackendUtama('updateJob', { id: state.jobForm.originalId, updates: data });
    }
    if (!resp.success) throw new Error(resp.message || 'Gagal menyimpan.');

    logActivity(state.jobForm.mode === 'add' ? 'Tambah Pekerjaan' : 'Ubah Pekerjaan', data.judul);
    await muatUlangDaftarPekerjaan();
    closeJobForm();
  } catch (err) {
    alert('Gagal menyimpan pekerjaan: ' + err.message);
  } finally {
    sedangMenyimpanJob = false;
    sembunyikanProgress();
  }
}
async function deleteJob(id){
  if (!confirm('Hapus pekerjaan ini? Tindakan tidak dapat dibatalkan.')) return;
  const job = MOCK_JOBS.find(j=>j.id===id);
  tampilkanProgress('Menghapus pekerjaan...');
  try {
    const resp = await callBackendUtama('deleteJob', { id });
    if (!resp.success) throw new Error(resp.message || 'Gagal menghapus.');
    logActivity('Hapus Pekerjaan', job ? job.judul : id);
    await muatUlangDaftarPekerjaan();
    render();
  } catch (err) {
    alert('Gagal menghapus pekerjaan: ' + err.message);
  } finally {
    sembunyikanProgress();
  }
}

function exportJobManagementExcel(){
  const rows = MOCK_JOBS.map((j, idx) => {
    const user = MOCK_USERS.find(u=>u.email===j.ditugaskanKe);
    const totalHari = calcTotalHari(j.tanggalMulai, j.tenggatWaktu);
    return {
      'No': idx + 1,
      'Pekerjaan': j.judul,
      'Ditugaskan Ke': user ? user.nama : '-',
      'Prioritas': j.prioritas,
      'Target Selesai': formatDDMMYY(j.tenggatWaktu),
      'Total Hari': totalHari !== null ? totalHari : '',
      'Status': j.status,
    };
  });
  exportRowsToExcel('Penugasan_Pekerjaan.xlsx', rows);
}

async function startJob(id){
  const job = MOCK_JOBS.find(j=>j.id===id);
  try {
    const resp = await callBackendUtama('updateJob', { id, updates: { status: 'Sedang Dikerjakan' } });
    if (!resp.success) throw new Error(resp.message || 'Gagal menyimpan.');
    job.status = 'Sedang Dikerjakan';
    render();
  } catch (err) {
    alert('Gagal memulai pekerjaan: ' + err.message);
  }
}
function openCompleteJobForm(id){ state.completingJobId = id; render(); }
function cancelCompleteJob(){ state.completingJobId = null; render(); }
async function submitCompleteJob(id){
  const catatan = getFieldVal('mj-catatan-'+id);
  if (!catatan){ alert('Isi catatan pengerjaan terlebih dahulu'); return; }
  const job = MOCK_JOBS.find(j=>j.id===id);
  const tanggalSelesai = new Date().toISOString().slice(0,10);
  try {
    const resp = await callBackendUtama('updateJob', { id, updates: { catatanPengerjaan: catatan, status: 'Menunggu Persetujuan', tanggalSelesai } });
    if (!resp.success) throw new Error(resp.message || 'Gagal menyimpan.');
    job.catatanPengerjaan = catatan;
    job.status = 'Menunggu Persetujuan';
    job.tanggalSelesai = tanggalSelesai;
    state.completingJobId = null;
    render();
  } catch (err) {
    alert('Gagal mengirim untuk persetujuan: ' + err.message);
  }

/* ================================================================
   PERSETUJUAN PEKERJAAN — approval dengan catatan/notasi
   ================================================================ */
async function approveJob(id){
  const catatan = getFieldVal('ap-catatan-'+id);
  const job = MOCK_JOBS.find(j=>j.id===id);
  const now = new Date();
  const tgl = now.toISOString().slice(0,10);
  const jam = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  const tanggalWaktuDisetujui = `${tgl} ${jam}`;
  try {
    const resp = await callBackendUtama('updateJob', { id, updates: { status:'Disetujui', catatanPersetujuan: catatan, disetujuiOleh: state.session.email, tanggalWaktuDisetujui } });
    if (!resp.success) throw new Error(resp.message || 'Gagal menyimpan.');
    job.status = 'Disetujui'; job.catatanPersetujuan = catatan; job.disetujuiOleh = state.session.email;
    job.tanggalWaktuDisetujui = tanggalWaktuDisetujui;
    logActivity('Setujui Pekerjaan', job.judul);
    render();
  } catch (err) {
    alert('Gagal menyetujui pekerjaan: ' + err.message);
  }
}
async function rejectJob(id){
  const catatan = getFieldVal('ap-catatan-'+id);
  if (!catatan){ alert('Isi catatan alasan penolakan terlebih dahulu'); return; }
  const job = MOCK_JOBS.find(j=>j.id===id);
  try {
    const resp = await callBackendUtama('updateJob', { id, updates: { status:'Ditolak', catatanPersetujuan: catatan, disetujuiOleh: state.session.email } });
    if (!resp.success) throw new Error(resp.message || 'Gagal menyimpan.');
    job.status = 'Ditolak'; job.catatanPersetujuan = catatan; job.disetujuiOleh = state.session.email;
    logActivity('Tolak Pekerjaan', job.judul);
    render();
  } catch (err) {
    alert('Gagal menolak pekerjaan: ' + err.message);
  }
}

/* ================================================================
   DAFTAR SELURUH PEKERJAAN — view semua job; aksi hanya muncul
   jika job tersebut terkait akun yang sedang login (sebagai
   pelaksana atau sebagai penyetuju).
   ================================================================ */
function jobNeedsAction(j, email){
  const isApprover = j.approverEmail === email && j.status === 'Menunggu Persetujuan';
  const isAssignee = j.ditugaskanKe === email && ['Belum Dikerjakan','Sedang Dikerjakan','Ditolak'].includes(j.status);
  return isApprover || isAssignee;
}
function jobIsMine(j, email){
  // Kalau saya pelaksananya, selalu dianggap "milik saya" apa pun statusnya.
  const isAssignee = j.ditugaskanKe === email;
  // Kalau saya cuma pembuat/penyetuju (bukan pelaksana), pekerjaan baru dianggap
  // "milik saya" setelah pelaksana menandai selesai — bukan saat masih dikerjakan.
  const isCreatorOrApprover = (j.dibuatOleh === email || j.approverEmail === email)
    && !['Belum Dikerjakan','Sedang Dikerjakan'].includes(j.status);
  return isAssignee || isCreatorOrApprover;
}

function getJobSortValue(j, key){
  switch(key){
    case 'nomor': return 0; // urutan asli, tidak dipakai untuk sort
    case 'tanggalMulai': return j.tanggalMulai || '';
    case 'waktuMulai': return j.waktuMulai || '';
    case 'judul': return (j.judul||'').toLowerCase();
    case 'ditugaskanKe': { const u = MOCK_USERS.find(u=>u.email===j.ditugaskanKe); return u ? u.nama.toLowerCase() : ''; }
    case 'approverEmail': { const u = MOCK_USERS.find(u=>u.email===j.approverEmail); return u ? u.nama.toLowerCase() : ''; }
    case 'prioritas': return { 'Tinggi':0, 'Sedang':1, 'Rendah':2 }[j.prioritas] ?? 9;
    case 'tenggatWaktu': return j.tenggatWaktu || '';
    case 'totalHari': { const t = calcTotalHari(j.tanggalMulai, j.tenggatWaktu); return t === null ? -Infinity : t; }
    case 'status': return (j.status||'').toLowerCase();
    case 'disetujuiOleh': { const u = MOCK_USERS.find(u=>u.email===j.disetujuiOleh); return u ? u.nama.toLowerCase() : ''; }
    default: return '';
  }
}
function sortableTh(label, key){
  const active = state.jobsView.sortKey === key;
  const arrow = active ? (state.jobsView.sortDir === 'asc' ? ' \u25B2' : ' \u25BC') : '';

const JOBS_PAGE_SIZE = 10;

/* ================================================================
   MESIN TABEL GENERIK — search, sort, pagination, kolom No.
   Dipakai di semua tabel manajemen data (User, Klien, Reminder, dst).
   ================================================================ */
if (!state.tables) state.tables = {};
const TABLE_PAGE_SIZE = 10;
const TABLE_REGISTRY = {};

function getTableState(key){
  if (!state.tables[key]) state.tables[key] = { search:'', sortKey:null, sortDir:'asc', page:1 };
  return state.tables[key];
}
function registerManagedTable(key, columns, dataFn){
  TABLE_REGISTRY[key] = { columns, dataFn };
}
function computeManagedTableRows(key){
  const { columns, dataFn } = TABLE_REGISTRY[key];
  const ts = getTableState(key);
  let data = dataFn();
  if (ts.search.trim()){
    const q = ts.search.trim().toLowerCase();
    data = data.filter(row => columns.some(col => {
      if (!col.searchable) return false;
      const v = col.searchValue ? col.searchValue(row) : '';
      return String(v).toLowerCase().includes(q);
    }));
  }
  if (ts.sortKey){
    const col = columns.find(c=>c.key===ts.sortKey);
    if (col && col.sortValue){
      data = [...data].sort((a,b)=>{
        const va = col.sortValue(a), vb = col.sortValue(b);
        const dir = ts.sortDir === 'asc' ? 1 : -1;
        if (va < vb) return -1*dir;
        if (va > vb) return 1*dir;
        return 0;
      });
    }
  }
  return data;
}
function renderManagedTableHtml(key){
  const { columns } = TABLE_REGISTRY[key];
  const ts = getTableState(key);
  const allFiltered = computeManagedTableRows(key);
  const totalPages = Math.max(1, Math.ceil(allFiltered.length / TABLE_PAGE_SIZE));
  if (ts.page > totalPages) ts.page = totalPages;
  const startIdx = (ts.page - 1) * TABLE_PAGE_SIZE;
  const pageRows = allFiltered.slice(startIdx, startIdx + TABLE_PAGE_SIZE);

  const theadHtml = `<tr class="table-navy-head"><th>No</th>${columns.map(col=>{
    if (!col.sortValue) return `<th>${col.label}</th>`;
    const active = ts.sortKey === col.key;
    const arrow = active ? (ts.sortDir==='asc' ? ' \u25B2' : ' \u25BC') : '';
    return `<th class="sortable" onclick="setManagedTableSort('${key}','${col.key}')">${col.label}${arrow}</th>`;
  }).join('')}</tr>`;

  const bodyRowsHtml = pageRows.map((row,i)=>`<tr><td>${startIdx+i+1}</td>${columns.map(col=>`<td${col.nowrap?' class="nowrap-cell"':''}>${col.cell(row)}</td>`).join('')}</tr>`).join('');

  const paginationHtml = `<div class="pagination-row">
    <div>Menampilkan ${allFiltered.length?startIdx+1:0}–${Math.min(startIdx+TABLE_PAGE_SIZE, allFiltered.length)} dari ${allFiltered.length} data${ts.search?' (hasil pencarian)':''}</div>
    <div style="display:flex;gap:6px;align-items:center;">
      <button class="page-btn" ${ts.page<=1?'disabled':''} onclick="setManagedTablePage('${key}',${ts.page-1})">&laquo; Sebelumnya</button>
      ${Array.from({length: totalPages}, (_,i)=>i+1).map(p=>`<button class="page-btn ${p===ts.page?'active':''}" onclick="setManagedTablePage('${key}',${p})">${p}</button>`).join('')}
      <button class="page-btn" ${ts.page>=totalPages?'disabled':''} onclick="setManagedTablePage('${key}',${ts.page+1})">Berikutnya &raquo;</button>
    </div>
  </div>`;

  return `<div class="card"><table class="jobs-table">${theadHtml}${bodyRowsHtml || `<tr><td colspan="${columns.length+1}" style="color:var(--ink-soft);">Tidak ada data.</td></tr>`}</table></div>${paginationHtml}`;
}
function renderManagedTableSearchHtml(key, placeholder, extraButtonsHtml){
  const ts = getTableState(key);
  return `<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
    <div style="max-width:320px;flex:1;min-width:200px;">
      <input type="text" id="mtable-search-${key}" placeholder="${placeholder||'Cari...'}" value="${ts.search}" oninput="setManagedTableSearch('${key}', this.value)" style="width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-size:13.5px;margin-bottom:0;">
    </div>
    ${extraButtonsHtml ? `<div style="display:flex;gap:8px;flex-wrap:wrap;">${extraButtonsHtml}</div>` : ''}
  </div>`;
}
function refreshManagedTableDOM(key){
  const el = document.getElementById('mtable-body-'+key);
  if (el) el.innerHTML = renderManagedTableHtml(key);
}
function setManagedTableSearch(key, value){
  getTableState(key).search = value;
  getTableState(key).page = 1;
  refreshManagedTableDOM(key);
}
function setManagedTableSort(key, colKey){
  const ts = getTableState(key);
  if (ts.sortKey === colKey) ts.sortDir = ts.sortDir==='asc' ? 'desc' : 'asc';
  else { ts.sortKey = colKey; ts.sortDir = 'asc'; }
  refreshManagedTableDOM(key);
}
function setManagedTablePage(key, page){
  getTableState(key).page = page;

}
function managedTableBlock(key, columns, dataFn, searchPlaceholder, extraButtonsHtml){
  registerManagedTable(key, columns, dataFn);
  return `${renderManagedTableSearchHtml(key, searchPlaceholder, extraButtonsHtml)}<div id="mtable-body-${key}">${renderManagedTableHtml(key)}</div>`;
}
function formatDDMMYY(dateStr){
  if (!dateStr) return '-';
  const parts = dateStr.split('-');
  if (parts.length !== 3) return dateStr;
  const [yyyy, mm, dd] = parts;
  return `${dd}-${mm}-${yyyy.slice(2)}`;
}
function formatDateTimeDDMMYY(dtStr){
  if (!dtStr) return '';
  const [datePart, timePart] = dtStr.split(' ');
  return `${formatDDMMYY(datePart)}${timePart ? ' ' + timePart : ''}`;
}

function exportJobsTableExcel(){
  const myEmail = state.session.email;
  const base = state.jobsView.filter === 'aksi_saya' ? MOCK_JOBS.filter(j=>jobNeedsAction(j, myEmail))
    : state.jobsView.filter === 'pekerjaan_saya' ? MOCK_JOBS.filter(j=>jobIsMine(j, myEmail))
    : MOCK_JOBS;
  const sorted = getSortedJobs(base);
  const rows = sorted.map((j, idx) => {
    const assignee = MOCK_USERS.find(u=>u.email===j.ditugaskanKe);
    const disetujuiOlehUser = MOCK_USERS.find(u=>u.email===j.disetujuiOleh);
    const totalHari = calcTotalHari(j.tanggalMulai, j.tenggatWaktu);
    return {
      'No': idx + 1,
      'Tanggal Mulai': formatDDMMYY(j.tanggalMulai),
      'Waktu Mulai': j.waktuMulai || '',
      'Pekerjaan': j.judul,
      'Ditugaskan Ke': assignee ? assignee.nama : '-',
      'Prioritas': j.prioritas,
      'Target Selesai': formatDDMMYY(j.tenggatWaktu),
      'Total Hari': totalHari !== null ? totalHari : '',
      'Status': j.status,
      'Disetujui Oleh': disetujuiOlehUser ? disetujuiOlehUser.nama : '-',
      'Tanggal & Waktu Disetujui': formatDateTimeDDMMYY(j.tanggalWaktuDisetujui),
    };
  });
  exportRowsToExcel('Daftar_Pekerjaan.xlsx', rows);
}
function getSortedJobs(jobsArray){
  return [...(jobsArray || MOCK_JOBS)].sort((a,b)=>{
    const va = getJobSortValue(a, state.jobsView.sortKey);
    const vb = getJobSortValue(b, state.jobsView.sortKey);
    const dir = state.jobsView.sortDir === 'asc' ? 1 : -1;
    if (va < vb) return -1 * dir;
    if (va > vb) return 1 * dir;
    return 0;
  });
}

function renderJobStatusSummaryCards(){
  const STATUS_ORDER = ['Belum Dikerjakan','Sedang Dikerjakan','Menunggu Persetujuan','Disetujui','Ditolak'];
  const STATUS_COLORS = {
    'Belum Dikerjakan': 'var(--slate)',
    'Sedang Dikerjakan': 'var(--gold)',
    'Menunggu Persetujuan': '#54565C',
    'Disetujui': 'var(--sage)',
    'Ditolak': 'var(--danger)',
  };
  const cards = STATUS_ORDER.map(status => {
    const count = MOCK_JOBS.filter(j=>j.status===status).length;
    const percent = MOCK_JOBS.length ? Math.round((count / MOCK_JOBS.length) * 100) : 0;
    const color = STATUS_COLORS[status];
    return `<div class="status-count-card" style="background:${color};border-color:${color};">
      <div class="status-count-value" style="color:#ffffff;">${count}</div>
      <div class="status-count-label" style="color:rgba(255,255,255,0.9);"><b>${percent}%</b> ${status}</div>
    </div>`;
  }).join('');
  return `<div class="status-count-row">${cards}</div>`;
}

function renderAllJobs(){
  const myEmail = state.session.email;
  const myActionCount = MOCK_JOBS.filter(j=>jobNeedsAction(j, myEmail)).length;
  const myMineCount = MOCK_JOBS.filter(j=>jobIsMine(j, myEmail)).length;

  const tabsHtml = `<div class="tabs-row">
    <button class="tab-btn ${state.jobsView.tab==='kartu'?'active':''}" onclick="setJobsTab('kartu')">Kartu</button>
    <button class="tab-btn ${state.jobsView.tab==='tabel'?'active':''}" onclick="setJobsTab('tabel')">Tabel</button>
  </div>`;
  const filterHtml = `<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
    <button class="filter-pill ${state.jobsView.filter==='semua'?'active':''}" onclick="setJobsFilter('semua')">Semua Pekerjaan</button>
    <button class="filter-pill ${state.jobsView.filter==='pekerjaan_saya'?'active':''}" onclick="setJobsFilter('pekerjaan_saya')">Pekerjaan Saya ${myMineCount ? `(${myMineCount})` : ''}</button>
    <button class="filter-pill ${state.jobsView.filter==='aksi_saya'?'active':''}" onclick="setJobsFilter('aksi_saya')">Perlu Aksi Saya ${myActionCount ? `(${myActionCount})` : ''}</button>
  </div>`;
  const summaryHtml = renderJobStatusSummaryCards();
  const filteredJobs = state.jobsView.filter === 'aksi_saya' ? MOCK_JOBS.filter(j=>jobNeedsAction(j, myEmail))
    : state.jobsView.filter === 'pekerjaan_saya' ? MOCK_JOBS.filter(j=>jobIsMine(j, myEmail))
    : MOCK_JOBS;

  if (state.jobsView.tab === 'tabel'){
    return head('Daftar Pekerjaan', `Lihat, kerjakan, dan setujui pekerjaan tim — ada ${MOCK_JOBS.length} pekerjaan terbagi dalam kartu dibawah ini`) + summaryHtml + tabsHtml + filterHtml + `
      <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
        <div style="max-width:320px;flex:1;min-width:220px;">
          <input type="text" placeholder="Cari judul pekerjaan atau nama penerima tugas..." value="${state.jobsView.search||''}" oninput="setJobsSearch(this.value)" style="width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-size:13.5px;margin-bottom:0;">
        </div>
        <button class="btn-secondary" onclick="exportJobsTableExcel()">${fileIconSvg('#1D6F42','XLS')}<span class="btn-label">Export Excel</span></button>
      </div>
      <div id="jobs-table-wrap">${buildJobsTableSection(filteredJobs, myEmail)}</div>`;
  }

  const sortedForCards = [...filteredJobs].sort((a,b)=>{
    return (jobNeedsAction(b, myEmail) ? 1 : 0) - (jobNeedsAction(a, myEmail) ? 1 : 0);
  });

  const cards = sortedForCards.length ? sortedForCards.map(j => {
    const assignee = MOCK_USERS.find(u=>u.email===j.ditugaskanKe);
    const approver = MOCK_USERS.find(u=>u.email===j.approverEmail);
    const client = MOCK_CLIENTS.find(c=>c.id===j.klienId);
    const totalHari = calcTotalHari(j.tanggalMulai, j.tenggatWaktu);

    const isAssignee = j.ditugaskanKe === myEmail;
    const isApprover = j.approverEmail === myEmail && j.status === 'Menunggu Persetujuan';
    const needsMyAction = jobNeedsAction(j, myEmail);

    let actionBlock = '';
    let actionLabel = '';
    if (isApprover){
      actionLabel = `<span class="stamp-tag" style="margin-left:8px;">perlu persetujuan Anda</span>`;
      actionBlock = buildApproverActionHtml(j);
    } else if (isAssignee && ['Belum Dikerjakan','Sedang Dikerjakan','Ditolak'].includes(j.status)){
      actionLabel = `<span class="stamp-tag" style="margin-left:8px;">pekerjaan Anda</span>`;
      actionBlock = `<div style="margin-top:10px;">${buildAssigneeActionHtml(j)}</div>`;
    } else if (isAssignee){
      actionLabel = `<span class="stamp-tag" style="margin-left:8px;">pekerjaan Anda</span>`;
    }

    return `<div class="card" style="margin-bottom:14px;${isApprover||isAssignee ? 'border-color:var(--gold);' : ''}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
        <div>
          <div style="font-weight:600;color:var(--navy);font-size:14.5px;display:flex;align-items:center;flex-wrap:wrap;">${j.judul}${actionLabel}</div>
          ${client ? `<div style="font-size:12px;color:var(--ink-soft);margin-top:2px;">Klien: ${client.nama}</div>` : ''}
          <div style="font-size:12.5px;color:var(--ink-soft);margin-top:4px;">${j.deskripsi || ''}</div>
          <div style="font-size:11.5px;color:var(--ink-soft);margin-top:6px;">
            Ditugaskan ke: <b>${assignee ? assignee.nama : '-'}</b> &nbsp;·&nbsp;
            Harus disetujui oleh: <b>${approver ? approver.nama : 'Belum ditentukan'}</b>
          </div>
          <div style="font-size:11.5px;color:var(--ink-soft);margin-top:4px;">
            Prioritas: <b>${j.prioritas}</b> &nbsp;·&nbsp; Mulai: <b>${j.tanggalMulai||'-'}</b> &nbsp;·&nbsp;
            Target Selesai: <b>${j.tenggatWaktu||'-'}</b>${totalHari!==null?` (${totalHari} hari)`:''}
          </div>
          ${j.catatanPengerjaan ? `<div style="font-size:12px;color:var(--ink-soft);margin-top:6px;">Catatan pengerjaan: "${j.catatanPengerjaan}"</div>` : ''}
          ${j.catatanPersetujuan ? `<div style="font-size:12px;color:${j.status==='Ditolak'?'var(--danger)':'var(--sage)'};margin-top:4px;">Catatan persetujuan: "${j.catatanPersetujuan}"</div>` : ''}
        </div>
        <span class="badge ${JOB_STATUS_BADGE[j.status]||'pending'}${needsMyAction ? ' badge-blink' : ''}">${j.status}</span>
      </div>
      ${actionBlock}
    </div>`;
  }).join('') : `<div class="empty">${state.jobsView.filter==='aksi_saya' ? 'Tidak ada pekerjaan yang perlu Anda tindak saat ini.' : state.jobsView.filter==='pekerjaan_saya' ? 'Tidak ada pekerjaan yang terkait dengan Anda.' : 'Belum ada pekerjaan yang dibuat.'}</div>`;

  return head('Daftar Pekerjaan', `Lihat, kerjakan, dan setujui pekerjaan tim — ada ${MOCK_JOBS.length} pekerjaan terbagi dalam kartu dibawah ini`) + summaryHtml + tabsHtml + filterHtml + cards;
}

}

function buildClientSearchResultsHtml(){
  const q = (state.clientMonitoring.searchQuery || '').toLowerCase().trim();
  const filtered = q ? MOCK_CLIENTS.filter(c => c.nama.toLowerCase().includes(q)) : MOCK_CLIENTS;
  if (!filtered.length) return `<div style="padding:10px 12px;color:var(--ink-soft);font-size:12.5px;">Tidak ditemukan</div>`;
  return filtered.map(c => `<div class="client-search-row ${c.id===state.clientMonitoring.selectedClientId?'active':''}" onmousedown="setMonitoringClient('${c.id}')">
    ${c.nama} <span style="font-size:11px;">(${c.npwp})</span>
  </div>`).join('');
}
function handleClientSearchInput(value){
  state.clientMonitoring.searchQuery = value;
  const resultsEl = document.getElementById('client-search-results');
  if (resultsEl){
    resultsEl.innerHTML = buildClientSearchResultsHtml();
    resultsEl.style.display = 'block';
  }
}
function openClientSearchDropdown(){
  const resultsEl = document.getElementById('client-search-results');
  if (resultsEl) resultsEl.style.display = 'block';
}
function closeClientSearchDropdown(){
  // beri jeda supaya klik pada item sempat terdaftar (pakai onmousedown) sebelum list disembunyikan
  setTimeout(() => {

    if (resultsEl) resultsEl.style.display = 'none';
  }, 150);
}

function renderInvoiceTab(c){
  const invoices = MOCK_INVOICES.filter(i=>i.clientId===c.id);
  const totalPemasukan = invoices.reduce((s,i)=>s+invoiceTagihan(i),0);
  const totalDibayarkan = invoices.filter(i=>i.status==='Lunas').reduce((s,i)=>s+invoiceTagihan(i),0);
  const totalHutang = invoices.filter(i=>i.status!=='Lunas').reduce((s,i)=>s+invoiceTagihan(i),0);

  const statsHtml = `<div class="grid grid-3">
    <div class="card"><div class="stat-label">Total Pemasukan</div><div class="stat-value">${rupiah(totalPemasukan)}</div></div>
    <div class="card"><div class="stat-label">Total Dibayarkan</div><div class="stat-value" style="color:var(--sage);">${rupiah(totalDibayarkan)}</div></div>
    <div class="card"><div class="stat-label">Total Hutang</div><div class="stat-value" style="color:var(--danger);">${rupiah(totalHutang)}</div></div>
  </div>`;

  if (!invoices.length) return statsHtml + `<div class="empty">Belum ada invoice untuk klien ini.</div>`;

  const invoiceTabColumns = [
    { key:'id', label:'No. Invoice', searchable:true, sortValue:(inv)=>inv.id, searchValue:(inv)=>inv.id, cell:(inv)=>inv.id },
    { key:'klien', label:'Klien', searchable:false, sortValue:()=>c.nama, cell:()=>c.nama },
    { key:'tanggal', label:'Tanggal', searchable:false, sortValue:(inv)=>inv.tanggal, nowrap:true, cell:(inv)=>formatDDMMYY(inv.tanggal) },
    { key:'layanan', label:'Layanan', searchable:true, searchValue:(inv)=>invoiceRingkasanLayanan(inv), cell:(inv)=>invoiceRingkasanLayanan(inv) },
    { key:'total', label:'Total Tagihan', searchable:false, sortValue:(inv)=>invoiceTagihan(inv), cell:(inv)=>rupiah(invoiceTagihan(inv)) },
    { key:'status', label:'Status', searchable:true, sortValue:(inv)=>inv.status.toLowerCase(), searchValue:(inv)=>inv.status, cell:(inv)=>`<span class="badge ${inv.status==='Lunas'?'ok':'pending'}">${inv.status}</span>` },
    { key:'aksi', label:'Aksi', cell:(inv)=>`<span style="cursor:pointer;color:var(--gold);font-size:12.5px;" onclick="openInvoiceDocument('${inv.id}')">${ICON_EYE}Lihat</span>` },
  ];

  return statsHtml + managedTableBlock('invoice_tab_'+c.id, invoiceTabColumns, () => MOCK_INVOICES.filter(i=>i.clientId===c.id), 'Cari no. invoice, layanan, atau status...');
}

            <div style="font-size:12.5px;color:var(--ink-soft);text-align:right;">
